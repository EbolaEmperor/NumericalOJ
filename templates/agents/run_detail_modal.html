{# Agent 任务详情弹窗。运行轨迹直接复用 Reverse Judge / Agent Judge 的共享渲染器。 #}
{% include 'components/agents/execution_trace_assets.html' %}
<link rel="stylesheet" href="{{ url_for('static', filename='app/agents/run-detail-modal.css') }}">

<div class="modal fade"
     id="agentTaskDetailModal"
     tabindex="-1"
     aria-labelledby="agentTaskDetailModalLabel"
     aria-hidden="true"
     data-agent-task-modal
     data-initial-task-id="{{ open_task_id|default('', true) }}"
     data-status-url-template="{{ url_for('problem_core.admin_agent_run_status', task_id='__TASK_ID__') }}"
     data-stream-url-template="{{ url_for('problem_core.admin_agent_run_stream', task_id='__TASK_ID__') }}"
     data-submission-url-template="{{ url_for('submission.submission_detail', submission_id=0) }}">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content agent-task-modal-content">
      <div class="modal-header agent-task-modal-header">
        <div class="agent-task-modal-heading">
          <div class="agent-task-modal-kicker">AGENT EXECUTION</div>
          <h5 class="modal-title" id="agentTaskDetailModalLabel">
            <i class="fas fa-wave-square me-2" aria-hidden="true"></i>运行详情
          </h5>
          <div class="agent-task-modal-meta" data-agent-task-meta>正在读取任务信息…</div>
        </div>
        <div class="agent-task-modal-actions">
          <a class="btn btn-sm agent-task-final-link"
             href="#"
             target="_blank"
             rel="noopener noreferrer"
             data-agent-task-final-link
             hidden>
            <i class="fas fa-external-link-alt" aria-hidden="true"></i>
            <span data-agent-task-final-label>最终提交</span>
          </a>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
      </div>

      <div class="modal-body agent-task-modal-body">
        <section class="agent-task-run-summary" aria-label="任务状态" role="status" aria-live="polite">
          <div class="agent-task-status-copy">
            <span class="agent-task-status-pill is-pending" data-agent-task-status>等待中</span>
            <span class="agent-task-status-message" data-agent-task-message>任务排队中</span>
          </div>
          <div class="agent-task-run-facts">
            <div class="agent-task-run-fact">
              <span>BEST SCORE</span>
              <strong data-agent-task-score>0</strong>
            </div>
            <div class="agent-task-run-fact">
              <span>ATTEMPTS</span>
              <strong data-agent-task-attempts>0</strong>
            </div>
            <div class="agent-task-run-fact agent-task-run-updated">
              <span>UPDATED</span>
              <strong data-agent-task-updated>—</strong>
            </div>
          </div>
        </section>

        <div class="agent-task-trace-heading">
          <div>
            <div class="agent-task-trace-eyebrow">LIVE TRACE</div>
            <h6 class="mb-0">执行轨迹</h6>
          </div>
          <span class="agent-task-live-indicator" data-agent-task-live>
            <i aria-hidden="true"></i><span>等待连接</span>
          </span>
        </div>
        <div class="agent-task-trace" data-agent-task-trace aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='app/agents/run-detail-modal.js') }}"></script>

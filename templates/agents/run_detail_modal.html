{# Agent 任务详情弹窗。运行轨迹直接复用 Reverse Judge / Agent Judge 的共享渲染器。 #}
{% include 'ranking/scripts/execution_trace.html' %}

<div class="modal fade"
     id="agentTaskDetailModal"
     tabindex="-1"
     aria-labelledby="agentTaskDetailModalLabel"
     aria-hidden="true"
     data-agent-task-modal
     data-initial-task-id="{{ open_task_id|default('', true) }}"
     data-status-url-template="{{ url_for('problem_core.admin_agent_run_status', task_id='__TASK_ID__') }}"
     data-stream-url-template="{{ url_for('problem_core.admin_agent_run_stream', task_id='__TASK_ID__') }}"
     data-submission-url-template="{{ url_for('submission.submission_detail', submission_id=0) }}">
  <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content agent-task-modal-content">
      <div class="modal-header agent-task-modal-header">
        <div class="agent-task-modal-heading">
          <div class="agent-task-modal-kicker">AGENT EXECUTION</div>
          <h5 class="modal-title" id="agentTaskDetailModalLabel">
            <i class="fas fa-wave-square me-2" aria-hidden="true"></i>运行详情
          </h5>
          <div class="agent-task-modal-meta" data-agent-task-meta>正在读取任务信息…</div>
        </div>
        <div class="agent-task-modal-actions">
          <a class="btn btn-sm agent-task-final-link"
             href="#"
             target="_blank"
             rel="noopener noreferrer"
             data-agent-task-final-link
             hidden>
            <i class="fas fa-external-link-alt" aria-hidden="true"></i>
            <span data-agent-task-final-label>最终提交</span>
          </a>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
      </div>

      <div class="modal-body agent-task-modal-body">
        <section class="agent-task-run-summary" aria-label="任务状态" role="status" aria-live="polite">
          <div class="agent-task-status-copy">
            <span class="agent-task-status-pill is-pending" data-agent-task-status>等待中</span>
            <span class="agent-task-status-message" data-agent-task-message>任务排队中</span>
          </div>
          <div class="agent-task-run-facts">
            <div class="agent-task-run-fact">
              <span>BEST SCORE</span>
              <strong data-agent-task-score>0</strong>
            </div>
            <div class="agent-task-run-fact">
              <span>ATTEMPTS</span>
              <strong data-agent-task-attempts>0</strong>
            </div>
            <div class="agent-task-run-fact agent-task-run-updated">
              <span>UPDATED</span>
              <strong data-agent-task-updated>—</strong>
            </div>
          </div>
        </section>

        <div class="agent-task-trace-heading">
          <div>
            <div class="agent-task-trace-eyebrow">LIVE TRACE</div>
            <h6 class="mb-0">执行轨迹</h6>
          </div>
          <span class="agent-task-live-indicator" data-agent-task-live>
            <i aria-hidden="true"></i><span>等待连接</span>
          </span>
        </div>
        <div class="agent-task-trace" data-agent-task-trace aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<style>
  .agent-task-modal-content {
    --ink: #20211f;
    --muted: #73756f;
    --line: #e4e1da;
    --soft: #f7f6f2;
    --ok: #24734c;
    --err: #ad4035;
    --gold: #bd8c42;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
    min-height: min(760px, 88vh);
    overflow: hidden;
    border: 0;
    border-radius: 16px;
    color: var(--ink);
    box-shadow: 0 28px 80px rgba(34, 31, 26, .18);
  }
  .agent-task-modal-header {
    align-items: flex-start;
    padding: 1.15rem 1.35rem 1rem;
    border-bottom-color: var(--line);
    background:
      linear-gradient(115deg, rgba(255,255,255,.84), rgba(248,246,240,.96)),
      repeating-linear-gradient(90deg, transparent 0, transparent 23px, rgba(63,57,47,.035) 24px);
  }
  .agent-task-modal-heading {
    min-width: 0;
  }
  .agent-task-modal-kicker,
  .agent-task-trace-eyebrow {
    color: #8a7048;
    font-family: var(--mono);
    font-size: .67rem;
    font-weight: 700;
    letter-spacing: .14em;
  }
  .agent-task-modal-kicker {
    margin-bottom: .28rem;
  }
  .agent-task-modal-meta {
    max-width: min(68vw, 760px);
    margin-top: .32rem;
    overflow: hidden;
    color: var(--muted);
    font-family: var(--mono);
    font-size: .74rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent-task-modal-actions {
    display: flex;
    align-items: center;
    gap: .65rem;
    margin-left: 1rem;
  }
  .agent-task-final-link {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    border: 1px solid #20211f;
    border-radius: 999px;
    padding: .42rem .72rem;
    background: #20211f;
    color: #fff;
    font-size: .78rem;
    font-weight: 700;
    white-space: nowrap;
  }
  .agent-task-final-link:hover,
  .agent-task-final-link:focus-visible {
    border-color: #3e403c;
    background: #3e403c;
    color: #fff;
  }
  .agent-task-final-link[hidden] {
    display: none;
  }
  .agent-task-modal-body {
    padding: 1rem 1.35rem 1.35rem;
    background: #fcfcfa;
  }
  .agent-task-run-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: .78rem .9rem;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fff;
  }
  .agent-task-status-copy {
    display: flex;
    align-items: center;
    gap: .68rem;
    min-width: 0;
  }
  .agent-task-status-pill {
    flex: 0 0 auto;
    border: 1px solid #d5d2ca;
    border-radius: 999px;
    padding: .26rem .62rem;
    background: #f5f4ef;
    color: #65665f;
    font-size: .76rem;
    font-weight: 750;
  }
  .agent-task-status-pill.is-running {
    border-color: #bfd0ea;
    background: #f1f6fc;
    color: #285b94;
  }
  .agent-task-status-pill.is-completed {
    border-color: #bbd8c8;
    background: #f1f8f4;
    color: var(--ok);
  }
  .agent-task-status-pill.is-failed,
  .agent-task-status-pill.is-canceled {
    border-color: #ebc4be;
    background: #fff5f3;
    color: var(--err);
  }
  .agent-task-status-message {
    overflow: hidden;
    color: #3d3f3a;
    font-size: .88rem;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .agent-task-run-facts {
    display: flex;
    align-items: stretch;
    flex: 0 0 auto;
  }
  .agent-task-run-fact {
    min-width: 5.6rem;
    padding: 0 .8rem;
    border-left: 1px solid var(--line);
  }
  .agent-task-run-fact span {
    display: block;
    color: #8a8b85;
    font-family: var(--mono);
    font-size: .61rem;
    font-weight: 700;
    letter-spacing: .08em;
  }
  .agent-task-run-fact strong {
    display: block;
    margin-top: .1rem;
    color: var(--ink);
    font-family: var(--mono);
    font-size: .83rem;
    font-weight: 700;
  }
  .agent-task-run-updated {
    min-width: 10.8rem;
  }
  .agent-task-trace-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    margin: 1.05rem 0 .65rem;
  }
  .agent-task-trace-eyebrow {
    margin-bottom: .15rem;
    color: #8b8c86;
  }
  .agent-task-live-indicator {
    display: inline-flex;
    align-items: center;
    gap: .38rem;
    color: var(--muted);
    font-family: var(--mono);
    font-size: .68rem;
  }
  .agent-task-live-indicator i {
    width: .46rem;
    height: .46rem;
    border-radius: 999px;
    background: #b8b9b4;
  }
  .agent-task-live-indicator.is-live i {
    background: #318860;
    box-shadow: 0 0 0 4px rgba(49,136,96,.1);
  }
  .agent-task-live-indicator.is-ended i {
    background: #8e908a;
    box-shadow: none;
  }
  .agent-task-trace {
    min-height: 360px;
    padding: .82rem;
    border: 1px solid var(--line);
    border-radius: 11px;
    background:
      linear-gradient(#fff, #fff) padding-box,
      linear-gradient(135deg, #e7e1d5, #e7ebea) border-box;
  }
  @media (max-width: 767.98px) {
    .agent-task-modal-content {
      min-height: 92vh;
      border-radius: 12px;
    }
    .agent-task-modal-header,
    .agent-task-modal-body {
      padding-left: .9rem;
      padding-right: .9rem;
    }
    .agent-task-modal-actions {
      gap: .45rem;
      margin-left: .5rem;
    }
    .agent-task-run-summary,
    .agent-task-status-copy {
      align-items: flex-start;
      flex-direction: column;
    }
    .agent-task-run-facts {
      width: 100%;
      border-top: 1px solid var(--line);
      padding-top: .7rem;
    }
    .agent-task-run-fact {
      flex: 1 1 0;
      min-width: 0;
    }
    .agent-task-run-fact:first-child {
      border-left: 0;
      padding-left: 0;
    }
    .agent-task-run-updated {
      display: none;
    }
    .agent-task-status-message {
      white-space: normal;
    }
    .agent-task-trace {
      min-height: 320px;
      padding: .65rem;
    }
  }
</style>

<script>
(function () {
  if (window.__agentTaskDetailModalInit) return;
  window.__agentTaskDetailModalInit = true;

  var modalEl = document.querySelector('[data-agent-task-modal]');
  if (!modalEl || !window.bootstrap || !window.AgentExecutionTrace) return;

  var modal = new bootstrap.Modal(modalEl);
  var traceRoot = modalEl.querySelector('[data-agent-task-trace]');
  var metaEl = modalEl.querySelector('[data-agent-task-meta]');
  var statusEl = modalEl.querySelector('[data-agent-task-status]');
  var messageEl = modalEl.querySelector('[data-agent-task-message]');
  var scoreEl = modalEl.querySelector('[data-agent-task-score]');
  var attemptsEl = modalEl.querySelector('[data-agent-task-attempts]');
  var updatedEl = modalEl.querySelector('[data-agent-task-updated]');
  var liveEl = modalEl.querySelector('[data-agent-task-live]');
  var finalLinkEl = modalEl.querySelector('[data-agent-task-final-link]');
  var finalLabelEl = modalEl.querySelector('[data-agent-task-final-label]');
  var renderer = window.AgentExecutionTrace.create({
    keyPrefix: 'problem-agent',
    showThinkingLoader: true,
    showPendingLoader: true
  });
  var source = null;
  var pollingTimer = null;
  var currentTaskId = '';
  var liveGeneration = 0;

  var STATUS = {
    pending: {label: '等待中', className: 'is-pending'},
    running: {label: '运行中', className: 'is-running'},
    completed: {label: '已完成', className: 'is-completed'},
    failed: {label: '未通过', className: 'is-failed'},
    canceled: {label: '已取消', className: 'is-canceled'},
    cancelled: {label: '已取消', className: 'is-canceled'}
  };

  function taskUrl(template, taskId) {
    return String(template || '').split('__TASK_ID__').join(encodeURIComponent(taskId));
  }

  function submissionUrl(submissionId) {
    var id = Number(submissionId || 0);
    if (!Number.isInteger(id) || id <= 0) return '';
    return String(modalEl.dataset.submissionUrlTemplate || '').replace(
      /\/0(?=([?#]|$))/, '/' + String(id)
    );
  }

  function statusKey(value) {
    return String(value || 'Pending').trim().toLowerCase();
  }

  function isFinished(state) {
    var key = statusKey(state && state.status);
    return key === 'completed' || key === 'failed' || key === 'canceled' || key === 'cancelled';
  }

  function traceStatus(state) {
    var key = statusKey(state && state.status);
    if (key === 'pending') return 'pending';
    if (key === 'running') return 'running';
    if (key === 'failed' || key === 'canceled' || key === 'cancelled') return 'error';
    return key || 'pending';
  }

  function eventDetails(event) {
    if (!event || event.details == null) return null;
    if (typeof event.details === 'object') return event.details;
    if (typeof event.details === 'string') {
      try { return JSON.parse(event.details); }
      catch (_error) { return {raw: event.details}; }
    }
    return {value: event.details};
  }

  function eventTitle(level, eventType) {
    if (level === 'error') return '运行异常';
    if (level === 'warning') return '运行提示';
    if (level === 'success') return '阶段完成';
    if (eventType === 'harness_started') return 'Harness 已启动';
    return '运行事件';
  }

  function executionTrace(state) {
    var rows = Array.isArray(state && state.events) ? state.events : [];
    var messages = rows.map(function (event, index) {
      event = event && typeof event === 'object' ? event : {message: String(event || '')};
      var level = String(event.level || 'info').toLowerCase();
      var eventType = String(event.event_type || 'event');
      var details = eventDetails(event);
      var message = String(event.message || '').trim();
      var item = {
        kind: details !== null || level === 'error' ? 'tool_result' : 'assistant',
        title: details !== null ? (message || eventTitle(level, eventType)) : eventTitle(level, eventType),
        text: details !== null ? JSON.stringify(details, null, 2) : message,
        meta: String(event.time || ''),
        source: 'agent-task-event',
        phase: eventType,
        offset: index,
        event_index: index
      };
      if (item.kind === 'tool_result') item.is_error = level === 'error';
      return item;
    });
    var failed = traceStatus(state) === 'error';
    return {
      status: traceStatus(state),
      error_message: failed ? String((state && state.message) || 'Agent 任务未完成') : '',
      trace_messages: messages,
      trace_files: [],
      stdout: '',
      stderr: ''
    };
  }

  function setLiveState(label, className) {
    if (!liveEl) return;
    liveEl.classList.remove('is-live', 'is-ended');
    if (className) liveEl.classList.add(className);
    var text = liveEl.querySelector('span');
    if (text) text.textContent = label;
  }

  function updateLocation(taskId) {
    if (!window.history || !window.URL) return;
    var url = new URL(window.location.href);
    if (taskId) url.searchParams.set('task_id', taskId);
    else url.searchParams.delete('task_id');
    window.history.replaceState(window.history.state, '', url.toString());
  }

  function isCurrentRun(taskId, generation, activeSource) {
    if (taskId !== currentTaskId || generation !== liveGeneration) return false;
    return !activeSource || source === activeSource;
  }

  function applyState(state, expectedTaskId, generation) {
    if (
      !state || typeof state !== 'object'
      || !isCurrentRun(expectedTaskId, generation)
    ) return;
    var key = statusKey(state.status);
    var display = STATUS[key] || {label: String(state.status || '状态未知'), className: 'is-pending'};
    statusEl.textContent = display.label;
    statusEl.className = 'agent-task-status-pill ' + display.className;
    messageEl.textContent = String(state.message || '任务执行中');
    scoreEl.textContent = String(Number(state.best_score || 0));
    attemptsEl.textContent = String(Array.isArray(state.attempts) ? state.attempts.length : 0);
    updatedEl.textContent = String(state.updated_at || state.created_at || '—');
    if (state.problem_title) {
      metaEl.textContent = String(state.problem_title) + ' · Task ' + expectedTaskId;
    }

    renderer.render(traceRoot, executionTrace(state), {
      scope: expectedTaskId,
      source: 'agent-task-events',
      phase: 'run',
      runningText: 'Agent 正在执行',
      pendingText: '等待 Agent 开始执行',
      emptyText: '暂无运行轨迹',
      showThinkingLoader: true,
      showPendingLoader: true
    });

    var finished = isFinished(state);
    setLiveState(finished ? '任务已结束' : '实时更新', finished ? 'is-ended' : 'is-live');
    var finalId = Number(state.final_submission_id || 0);
    var finalUrl = finished ? submissionUrl(finalId) : '';
    finalLinkEl.hidden = !finalUrl;
    if (finalUrl) {
      finalLinkEl.href = finalUrl;
      finalLabelEl.textContent = '最终提交 #' + String(finalId);
    } else {
      finalLinkEl.removeAttribute('href');
      finalLabelEl.textContent = '最终提交';
    }
  }

  function stopLiveUpdates() {
    if (source) {
      source.close();
      source = null;
    }
    if (pollingTimer) {
      clearTimeout(pollingTimer);
      pollingTimer = null;
    }
  }

  function fetchState(taskId, generation) {
    var url = taskUrl(modalEl.dataset.statusUrlTemplate, taskId);
    return fetch(url, {headers: {'Accept': 'application/json'}, credentials: 'same-origin'})
      .then(function (response) {
        if (!response.ok) throw new Error('读取任务状态失败（HTTP ' + response.status + '）');
        return response.json();
      })
      .then(function (payload) {
        if (!payload || !payload.success || !payload.state) {
          throw new Error((payload && payload.message) || '任务状态不可用');
        }
        applyState(payload.state, taskId, generation);
        return payload.state;
      });
  }

  function startPolling(taskId, generation) {
    if (!isCurrentRun(taskId, generation)) return;
    fetchState(taskId, generation).then(function (state) {
      if (!isCurrentRun(taskId, generation) || isFinished(state)) return;
      pollingTimer = setTimeout(function () {
        startPolling(taskId, generation);
      }, 2000);
    }).catch(function (error) {
      if (!isCurrentRun(taskId, generation)) return;
      setLiveState('连接重试中', '');
      messageEl.textContent = error.message || '读取任务状态失败';
      pollingTimer = setTimeout(function () {
        startPolling(taskId, generation);
      }, 3000);
    });
  }

  function parseStreamState(event, taskId, generation) {
    try { applyState(JSON.parse(event.data), taskId, generation); }
    catch (_error) {
      setLiveState('数据异常', '');
    }
  }

  function startStream(taskId, generation) {
    if (!window.EventSource) {
      startPolling(taskId, generation);
      return;
    }
    var activeSource = new EventSource(
      taskUrl(modalEl.dataset.streamUrlTemplate, taskId)
    );
    source = activeSource;
    activeSource.addEventListener('status', function (event) {
      if (!isCurrentRun(taskId, generation, activeSource)) return;
      parseStreamState(event, taskId, generation);
    });
    activeSource.addEventListener('done', function (event) {
      if (!isCurrentRun(taskId, generation, activeSource)) return;
      parseStreamState(event, taskId, generation);
      activeSource.close();
      if (source === activeSource) source = null;
    });
    activeSource.addEventListener('timeout', function (event) {
      if (!isCurrentRun(taskId, generation, activeSource)) return;
      parseStreamState(event, taskId, generation);
    });
    activeSource.addEventListener('error', function () {
      if (!isCurrentRun(taskId, generation, activeSource)) return;
      if (activeSource.readyState === EventSource.CLOSED) {
        activeSource.close();
        if (source === activeSource) source = null;
        startPolling(taskId, generation);
      } else {
        setLiveState('正在重连', '');
      }
    });
  }

  function resetView(taskId, problemTitle) {
    renderer.reset(traceRoot);
    statusEl.textContent = '等待中';
    statusEl.className = 'agent-task-status-pill is-pending';
    messageEl.textContent = '正在连接任务状态…';
    scoreEl.textContent = '0';
    attemptsEl.textContent = '0';
    updatedEl.textContent = '—';
    metaEl.textContent = (problemTitle ? problemTitle + ' · ' : '') + 'Task ' + taskId;
    finalLinkEl.hidden = true;
    finalLinkEl.removeAttribute('href');
    setLiveState('正在连接', '');
    renderer.render(traceRoot, {
      status: 'pending', error_message: '', trace_messages: [], trace_files: []
    }, {
      scope: taskId,
      pendingText: '正在读取任务状态',
      showPendingLoader: true
    });
  }

  function openTask(taskId, problemTitle) {
    taskId = String(taskId || '').trim();
    if (!taskId) return;
    liveGeneration += 1;
    stopLiveUpdates();
    currentTaskId = taskId;
    resetView(taskId, String(problemTitle || '').trim());
    updateLocation(taskId);
    modal.show();
    startStream(taskId, liveGeneration);
  }

  document.addEventListener('click', function (event) {
    var button = event.target.closest && event.target.closest('[data-agent-task-detail]');
    if (!button) return;
    event.preventDefault();
    openTask(button.getAttribute('data-task-id'), button.getAttribute('data-problem-title'));
  });

  modalEl.addEventListener('hidden.bs.modal', function () {
    liveGeneration += 1;
    stopLiveUpdates();
    currentTaskId = '';
    renderer.reset(traceRoot);
    updateLocation('');
  });

  var initialTaskId = String(modalEl.dataset.initialTaskId || '').trim();
  if (initialTaskId) openTask(initialTaskId, '');
})();
</script>

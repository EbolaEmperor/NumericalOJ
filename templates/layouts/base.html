<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Numerical OJ{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}">
  {% block icon_assets %}
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/fontawesome/css/all.min.css') }}">
  {% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='math-curve-loaders/loader.css') }}">
  {% block model_family_assets %}
  <link rel="stylesheet" href="{{ url_for('static', filename='app/model-family-logos.css') }}">
  <script src="{{ url_for('static', filename='app/model-family.js') }}"></script>
  {% endblock %}
  <script src="{{ url_for('static', filename='math-curve-loaders/loader.js') }}"></script>
  {% block mathjax %}{% endblock %}
  {% block head %}{% endblock %}
  {% block bootstrap_runtime %}
  <script src="{{ url_for('static', filename='bootstrap/bootstrap.bundle.min.js') }}"></script>
  {% endblock %}
</head>
<body>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>

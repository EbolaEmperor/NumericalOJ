{# Agent 评测「评分详情」弹窗 + 实时进度。供「我的历史提交」「所有提交」共用。
   通过事件委托监听 .judge-detail-btn（含 AJAX 动态加载的按钮）。 #}
<div class="modal fade" id="judgeDetailModal" tabindex="-1" aria-labelledby="judgeDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="judgeDetailModalLabel">
            <i class="fas fa-list-check me-2 text-warning"></i>评分详情
          </h5>
          <div class="text-muted small" id="judgeModalMeta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="small text-muted" id="judgeModalStatus">正在连接评测进度…</span>
          <span class="small text-muted">得分
            <span class="fw-semibold" id="judgeModalTotal">0</span>
            / <span id="judgeModalMax">0</span>
          </span>
        </div>
        <div class="progress mb-3" style="height:6px;background:#f0f0f2;border-radius:999px;">
          <div class="progress-bar" id="judgeModalBar" role="progressbar"
               style="height:6px;border-radius:999px;background:#1f7a4d;width:0%;"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="aj-result-tabs" role="tablist" aria-label="评分结果视图">
            <button type="button" class="aj-result-tab active" data-judge-view="topo" role="tab" aria-selected="true">拓扑</button>
            <button type="button" class="aj-result-tab" data-judge-view="detail" role="tab" aria-selected="false">详情</button>
          </div>
          <span class="small text-muted">点击拓扑节点查看规则原文与评分证据</span>
        </div>
        <div id="judgeModalTopo" class="aj-result-view">
          <div class="text-muted text-center py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分拓扑…
          </div>
        </div>
        <div id="judgeModalRules" class="aj-result-view" hidden>
          <div class="text-muted text-center py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="aj-result-pop" id="judgeRuleReadPopup" hidden>
  <div class="aj-result-pop-box" role="dialog" aria-modal="true" aria-labelledby="judgeRuleReadTitle">
    <div class="aj-result-pop-head">
      <div>
        <div class="aj-result-pop-title" id="judgeRuleReadTitle">规则详情</div>
        <div class="aj-result-pop-meta" id="judgeRuleReadMeta"></div>
      </div>
      <button type="button" class="aj-result-pop-close" id="judgeRuleReadClose" aria-label="关闭"><i class="fas fa-times"></i></button>
    </div>
    <div class="aj-result-pop-body">
      <div class="aj-result-pop-section">
        <div class="aj-result-pop-label">规则原文</div>
        <div class="aj-md small" id="judgeRuleReadRule"></div>
      </div>
      <div class="aj-result-pop-section">
        <div class="aj-result-pop-label">评分证据</div>
        <div class="aj-md aj-evi small p-2" id="judgeRuleReadEvidence"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  if (window.__ajJudgeModalInit) return;
  window.__ajJudgeModalInit = true;
  var judgeModalEl = document.getElementById('judgeDetailModal');
  var judgeModal = null;
  function getModal() { if (!judgeModal && judgeModalEl && window.bootstrap) judgeModal = new bootstrap.Modal(judgeModalEl); return judgeModal; }
  var judgeSource = null;
  var BADGE = {
    pass: ['通过', '#1f7a4d', '#e9f3ec'],
    failed: ['未通过', '#b03a2e', '#f8e9e7'],
    skipped: ['依赖跳过', '#6c757d', '#f1f1f3'],
    error: ['异常', '#b07340', '#fbf0e3'],
    pending: ['待评测', '#2563cb', '#e8f0fb']
  };
  var STATUS = { Accepted: '评测完成', Error: '评测异常', Judging: '评测中', Queued: '等待评测', Pending: '待评测' };
  var currentJudgeSnapshot = null;
  var currentJudgeView = 'topo';
  var resultNodeW = 176, resultNodeH = 88, resultMarginX = 24, resultMarginY = 20, resultXGap = 88, resultYGap = 72;
  function closeJudgeStream() { if (judgeSource) { judgeSource.close(); judgeSource = null; } }
  function esc(s) { return (s || '').replace(/[&<>]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]; }); }
  function compactRuleText(s, n) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    if (!s) return '未填写规则内容';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function resultRuleTitle(r) { return (r.rule_name || '').trim() || compactRuleText(r.rule_text, 14); }
  function setJudgeView(view) {
    currentJudgeView = view || 'topo';
    document.querySelectorAll('[data-judge-view]').forEach(function (tab) {
      var on = tab.dataset.judgeView === currentJudgeView;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var topo = document.getElementById('judgeModalTopo');
    var detail = document.getElementById('judgeModalRules');
    if (topo) topo.hidden = currentJudgeView !== 'topo';
    if (detail) detail.hidden = currentJudgeView !== 'detail';
  }
  function topoLayoutForRules(rules) {
    var byId = {}, indeg = {}, adj = {};
    rules.forEach(function (r) { byId[r.rule_id] = r; indeg[r.rule_id] = 0; adj[r.rule_id] = []; });
    rules.forEach(function (r) {
      (r.dependencies || []).forEach(function (d) {
        if (adj[d]) { adj[d].push(r.rule_id); indeg[r.rule_id] += 1; }
      });
    });
    var queue = Object.keys(indeg).map(Number).filter(function (id) { return indeg[id] === 0; }).sort(function (a, b) { return a - b; });
    var order = [], level = {};
    rules.forEach(function (r) { level[r.rule_id] = 0; });
    while (queue.length) {
      var id = queue.shift();
      order.push(id);
      (adj[id] || []).sort(function (a, b) { return a - b; }).forEach(function (nxt) {
        level[nxt] = Math.max(level[nxt], level[id] + 1);
        indeg[nxt] -= 1;
        if (indeg[nxt] === 0) {
          queue.push(nxt);
          queue.sort(function (a, b) { return a - b; });
        }
      });
    }
    if (order.length !== rules.length) return null;
    var cols = {}, maxLevel = 0, maxRows = 1;
    order.forEach(function (id) {
      var lv = level[id] || 0;
      maxLevel = Math.max(maxLevel, lv);
      if (!cols[lv]) cols[lv] = [];
      cols[lv].push(id);
    });
    var positions = {}, rowById = {};
    Object.keys(cols).map(Number).sort(function (a, b) { return a - b; }).forEach(function (lv) {
      cols[lv].sort(function (a, b) {
        if (lv === 0) return a - b;
        function weight(id) {
          var deps = ((byId[id] && byId[id].dependencies) || []).filter(function (dep) {
            return rowById[dep] != null;
          });
          if (!deps.length) return Number.MAX_SAFE_INTEGER;
          return deps.reduce(function (sum, dep) { return sum + rowById[dep]; }, 0) / deps.length;
        }
        var wa = weight(a), wb = weight(b);
        return (wa - wb) || (a - b);
      });
      maxRows = Math.max(maxRows, cols[lv].length);
      cols[lv].forEach(function (id, row) {
        rowById[id] = row;
        positions[id] = {
          x: resultMarginX + row * (resultNodeW + resultXGap),
          y: resultMarginY + lv * (resultNodeH + resultYGap)
        };
      });
    });
    return {
      positions: positions,
      width: resultMarginX * 2 + maxRows * resultNodeW + (maxRows - 1) * resultXGap,
      height: resultMarginY * 2 + (maxLevel + 1) * resultNodeH + maxLevel * resultYGap
    };
  }
  function resultEdgeKey(from, to) {
    return from + ':' + to;
  }
  function resultSlotOffset(index, count, width) {
    if (count <= 1) return 0;
    var span = Math.max(0, width - 46);
    var step = Math.min(18, span / Math.max(1, count - 1));
    return (index - (count - 1) / 2) * step;
  }
  function buildResultEdgeRoutes(edges, layout) {
    var items = [], bySource = {}, byTarget = {}, byBand = {}, routes = {};
    edges.forEach(function (edge) {
      var from = layout.positions[edge.from], to = layout.positions[edge.to];
      if (!from || !to) return;
      var item = {fromId: edge.from, toId: edge.to, from: from, to: to};
      items.push(item);
      (bySource[edge.from] = bySource[edge.from] || []).push(item);
      (byTarget[edge.to] = byTarget[edge.to] || []).push(item);
      var band = Math.round(from.y + resultNodeH) + ':' + Math.round(to.y);
      (byBand[band] = byBand[band] || []).push(item);
    });
    Object.keys(bySource).forEach(function (key) {
      var group = bySource[key].sort(function (a, b) {
        return (a.to.x - b.to.x) || (a.toId - b.toId);
      });
      group.forEach(function (item, index) {
        item.sourceOffset = resultSlotOffset(index, group.length, resultNodeW);
      });
    });
    Object.keys(byTarget).forEach(function (key) {
      var group = byTarget[key].sort(function (a, b) {
        return (a.from.x - b.from.x) || (a.fromId - b.fromId);
      });
      group.forEach(function (item, index) {
        item.targetOffset = resultSlotOffset(index, group.length, resultNodeW);
      });
    });
    Object.keys(byBand).forEach(function (key) {
      var group = byBand[key].sort(function (a, b) {
        return (a.from.x - b.from.x) || (a.to.x - b.to.x) || (a.fromId - b.fromId) || (a.toId - b.toId);
      });
      group.forEach(function (item) {
        item.routeX1 = item.from.x + resultNodeW / 2 + (item.sourceOffset || 0);
        item.routeX2 = item.to.x + resultNodeW / 2 + (item.targetOffset || 0);
        item.routeLeft = Math.min(item.routeX1, item.routeX2);
        item.routeRight = Math.max(item.routeX1, item.routeX2);
        item.y1 = item.from.y + resultNodeH;
        item.y2 = item.to.y - 12;
        var span = Math.max(1, item.y2 - item.y1);
        item.laneTop = item.y1 + Math.max(18, Math.min(26, span * 0.30));
        item.laneBottom = item.y2 - Math.max(18, Math.min(26, span * 0.30));
        if (item.laneBottom < item.laneTop + 10) {
          item.laneTop = item.y1 + span * 0.42;
          item.laneBottom = item.y1 + span * 0.58;
        }
      });
      function between(v, a, b) {
        return v > Math.min(a, b) + 2 && v < Math.max(a, b) - 2;
      }
      function intervalOverlap(a, b, pad) {
        return a.routeLeft <= b.routeRight + pad && b.routeLeft <= a.routeRight + pad;
      }
      function laneCandidates(item) {
        var center = (item.laneTop + item.laneBottom) / 2;
        var candidates = [center], step = 8;
        for (var d = step; center - d >= item.laneTop || center + d <= item.laneBottom; d += step) {
          if (center - d >= item.laneTop) candidates.push(center - d);
          if (center + d <= item.laneBottom) candidates.push(center + d);
        }
        return candidates;
      }
      function crossingPenalty(item, laneY, other) {
        var score = 0;
        if (item.routeRight - item.routeLeft >= 28) {
          if (other.routeX1 > item.routeLeft + 2 && other.routeX1 < item.routeRight - 2 && between(laneY, other.y1, other.laneY)) score += 1;
          if (other.routeX2 > item.routeLeft + 2 && other.routeX2 < item.routeRight - 2 && between(laneY, other.laneY, other.y2)) score += 1;
        }
        if (other.routeRight - other.routeLeft >= 28) {
          if (item.routeX1 > other.routeLeft + 2 && item.routeX1 < other.routeRight - 2 && between(other.laneY, item.y1, laneY)) score += 1;
          if (item.routeX2 > other.routeLeft + 2 && item.routeX2 < other.routeRight - 2 && between(other.laneY, laneY, item.y2)) score += 1;
        }
        return score;
      }
      var placed = [];
      group.slice().sort(function (a, b) {
        return (b.routeRight - b.routeLeft) - (a.routeRight - a.routeLeft) || (a.routeLeft - b.routeLeft);
      }).forEach(function (item) {
        var center = (item.laneTop + item.laneBottom) / 2;
        var best = center, bestScore = Infinity;
        laneCandidates(item).forEach(function (laneY) {
          var score = Math.abs(laneY - center) * 0.02;
          placed.forEach(function (other) {
            if (item.routeRight - item.routeLeft >= 28 && other.routeRight - other.routeLeft >= 28 &&
                Math.abs(other.laneY - laneY) < 5 && intervalOverlap(item, other, 14)) {
              score += 100;
            }
            score += crossingPenalty(item, laneY, other) * 16;
          });
          if (score < bestScore) {
            bestScore = score;
            best = laneY;
          }
        });
        item.laneY = best;
        placed.push(item);
      });
    });
    var resultPlannedRoutes = [];
    function resultCrossLayerPoints(item, x1, y1, x2, y2) {
      var stepY = resultNodeH + resultYGap;
      var fromLevel = Math.round((item.from.y - resultMarginY) / stepY);
      var toLevel = Math.round((item.to.y - resultMarginY) / stepY);
      if (toLevel <= fromLevel + 1) return null;
      var minX = 8, maxX = Math.max(minX, layout.width - 8);
      function clampX(x) { return Math.max(minX, Math.min(maxX, x)); }
      function uniquePush(list, value) {
        value = Math.round(value * 10) / 10;
        if (list.indexOf(value) < 0) list.push(value);
      }
      function yCandidates(center, minY, maxY) {
        var list = [];
        [0, -8, 8, -16, 16, -24, 24].forEach(function (delta) {
          var y = Math.max(minY, Math.min(maxY, center + delta));
          uniquePush(list, y);
        });
        return list;
      }
      function blockedIntervals() {
        var pad = 12, intervals = [];
        Object.keys(layout.positions).forEach(function (id) {
          var pos = layout.positions[id];
          var lv = Math.round((pos.y - resultMarginY) / stepY);
          if (lv > fromLevel && lv < toLevel) intervals.push([pos.x - pad, pos.x + resultNodeW + pad]);
        });
        intervals.sort(function (a, b) { return a[0] - b[0]; });
        var merged = [];
        intervals.forEach(function (it) {
          var last = merged[merged.length - 1];
          if (!last || it[0] > last[1]) merged.push([it[0], it[1]]);
          else last[1] = Math.max(last[1], it[1]);
        });
        return merged;
      }
      function xCandidates(preferredX, intervals) {
        var list = [];
        [preferredX, x1, x2, minX, maxX].forEach(function (x) { uniquePush(list, clampX(x)); });
        intervals.forEach(function (it, index) {
          uniquePush(list, clampX(it[0] - 6));
          uniquePush(list, clampX(it[1] + 6));
          if (index < intervals.length - 1) {
            var gapLeft = it[1] + 6, gapRight = intervals[index + 1][0] - 6;
            if (gapRight >= gapLeft) uniquePush(list, clampX((gapLeft + gapRight) / 2));
          }
        });
        return list.filter(function (x) {
          return !intervals.some(function (it) { return x > it[0] && x < it[1]; });
        });
      }
      function routeSegments(points) {
        var segments = [];
        for (var i = 1; i < points.length; i++) {
          var a = points[i - 1], b = points[i];
          if (Math.abs(a.x - b.x) < 0.5 && Math.abs(a.y - b.y) < 0.5) continue;
          segments.push({x1: a.x, y1: a.y, x2: b.x, y2: b.y,
            vertical: Math.abs(a.x - b.x) < Math.abs(a.y - b.y)});
        }
        return segments;
      }
      function routePenalty(points) {
        var score = 0, current = routeSegments(points);
        resultPlannedRoutes.forEach(function (route) {
          var otherPoints = route.points || [
            {x: route.x1, y: route.y1}, {x: route.x1, y: route.laneY},
            {x: route.x2, y: route.laneY}, {x: route.x2, y: route.y2}
          ];
          routeSegments(otherPoints).forEach(function (a) {
            current.forEach(function (b) {
              if (a.vertical && b.vertical) {
                if (Math.abs(a.x1 - b.x1) < 7 &&
                    Math.max(Math.min(a.y1, a.y2), Math.min(b.y1, b.y2)) <= Math.min(Math.max(a.y1, a.y2), Math.max(b.y1, b.y2)) + 10) score += 80;
              } else if (!a.vertical && !b.vertical) {
                if (Math.abs(a.y1 - b.y1) < 7 &&
                    Math.max(Math.min(a.x1, a.x2), Math.min(b.x1, b.x2)) <= Math.min(Math.max(a.x1, a.x2), Math.max(b.x1, b.x2)) + 10) score += 70;
              } else {
                var v = a.vertical ? a : b, h = a.vertical ? b : a;
                if (v.x1 > Math.min(h.x1, h.x2) + 3 && v.x1 < Math.max(h.x1, h.x2) - 3 &&
                    h.y1 > Math.min(v.y1, v.y2) + 3 && h.y1 < Math.max(v.y1, v.y2) - 3) score += 18;
              }
            });
          });
        });
        return score;
      }
      var sourceCenterY = y1 + resultYGap / 2;
      var targetCenterY = item.to.y - resultYGap / 2;
      var sourceYs = yCandidates(sourceCenterY, y1 + 12, Math.min(y1 + resultYGap - 10, y2 - 36));
      var targetYs = yCandidates(targetCenterY, Math.max(y1 + 36, item.to.y - resultYGap + 10), y2 - 8);
      var intervals = blockedIntervals();
      var preferredX = x1 + (x2 - x1) * 0.5;
      var corridorXs = xCandidates(preferredX, intervals);
      if (!corridorXs.length) corridorXs = [clampX(preferredX), minX, maxX];
      var bestPoints = null, bestScore = Infinity;
      sourceYs.forEach(function (sourceY) {
        targetYs.forEach(function (targetY) {
          corridorXs.forEach(function (corridorX) {
            var points = [
              {x: x1, y: y1}, {x: x1, y: sourceY},
              {x: corridorX, y: sourceY}, {x: corridorX, y: targetY},
              {x: x2, y: targetY}, {x: x2, y: y2}
            ];
            var score = routePenalty(points) +
              Math.abs(sourceY - sourceCenterY) * 0.5 +
              Math.abs(targetY - targetCenterY) * 0.5 +
              Math.abs(corridorX - preferredX) * 0.12;
            if (score < bestScore) {
              bestScore = score;
              bestPoints = points;
            }
          });
        });
      });
      return bestPoints;
    }
    function rememberResultRoute(route) {
      resultPlannedRoutes.push(route);
      return route;
    }
    items.forEach(function (item) {
      var x1 = item.routeX1 != null ? item.routeX1 : item.from.x + resultNodeW / 2 + (item.sourceOffset || 0);
      var y1 = item.y1 != null ? item.y1 : item.from.y + resultNodeH;
      var x2 = item.routeX2 != null ? item.routeX2 : item.to.x + resultNodeW / 2 + (item.targetOffset || 0);
      var y2 = item.y2 != null ? item.y2 : item.to.y - 12;
      var span = Math.max(1, y2 - y1);
      var laneTop = y1 + Math.max(18, Math.min(26, span * 0.30));
      var laneBottom = y2 - Math.max(18, Math.min(26, span * 0.30));
      if (laneBottom < laneTop + 10) {
        laneTop = y1 + span * 0.42;
        laneBottom = y1 + span * 0.58;
      }
      var laneY = item.laneY != null ? item.laneY : (laneTop + laneBottom) / 2;
      var points = resultCrossLayerPoints(item, x1, y1, x2, y2);
      var route = {x1: x1, y1: y1, x2: x2, y2: y2, laneY: laneY, arrowTipY: item.to.y - 2};
      if (points) {
        route.points = points;
        route.laneY = points[Math.max(1, points.length - 2)].y;
      }
      routes[resultEdgeKey(item.fromId, item.toId)] = rememberResultRoute(route);
    });
    return routes;
  }
  function resultEdgePath(route) {
    function roundedPolylinePath(points, radius) {
      if (!points || !points.length) return '';
      var path = 'M ' + points[0].x + ' ' + points[0].y;
      for (var i = 1; i < points.length - 1; i++) {
        var prev = points[i - 1], curr = points[i], next = points[i + 1];
        var d1 = Math.sqrt(Math.pow(curr.x - prev.x, 2) + Math.pow(curr.y - prev.y, 2));
        var d2 = Math.sqrt(Math.pow(next.x - curr.x, 2) + Math.pow(next.y - curr.y, 2));
        if (d1 < 2 || d2 < 2) continue;
        var r = Math.min(radius, d1 / 2, d2 / 2);
        var inX = curr.x + (prev.x - curr.x) * r / d1;
        var inY = curr.y + (prev.y - curr.y) * r / d1;
        var outX = curr.x + (next.x - curr.x) * r / d2;
        var outY = curr.y + (next.y - curr.y) * r / d2;
        path += ' L ' + inX + ' ' + inY + ' Q ' + curr.x + ' ' + curr.y + ' ' + outX + ' ' + outY;
      }
      var last = points[points.length - 1];
      return path + ' L ' + last.x + ' ' + last.y;
    }
    if (route.points && route.points.length > 1) {
      return roundedPolylinePath(route.points, 10);
    }
    var x1 = route.x1, y1 = route.y1, x2 = route.x2, y2 = route.y2, laneY = route.laneY;
    var dx = x2 - x1;
    if (Math.abs(dx) < 2) {
      return 'M ' + x1 + ' ' + y1 + ' L ' + x2 + ' ' + y2;
    }
    if (Math.abs(dx) < 28) {
      var soft = Math.min(18, Math.max(8, (y2 - laneY) / 2));
      return 'M ' + x1 + ' ' + y1 +
        ' L ' + x1 + ' ' + laneY +
        ' C ' + x1 + ' ' + (laneY + soft) + ', ' + x2 + ' ' + (laneY + soft) + ', ' + x2 + ' ' + (laneY + soft * 2) +
        ' L ' + x2 + ' ' + y2;
    }
    var dir = dx >= 0 ? 1 : -1;
    var r = Math.min(14, Math.max(6, Math.abs(dx) / 2), Math.max(6, (y2 - laneY) / 2));
    return 'M ' + x1 + ' ' + y1 +
      ' L ' + x1 + ' ' + (laneY - r) +
      ' Q ' + x1 + ' ' + laneY + ' ' + (x1 + dir * r) + ' ' + laneY +
      ' L ' + (x2 - dir * r) + ' ' + laneY +
      ' Q ' + x2 + ' ' + laneY + ' ' + x2 + ' ' + (laneY + r) +
      ' L ' + x2 + ' ' + y2;
  }
  function setResultTopoFocus(surface, ruleId, edgeId) {
    var active = ruleId != null || !!edgeId;
    surface.classList.toggle('has-focus', active);
    var edgeParts = edgeId ? edgeId.split(':') : null;
    surface.querySelectorAll('.aj-result-edge, .aj-result-arrow').forEach(function (edge) {
      var on = edgeId
        ? edge.dataset.edgeKey === edgeId
        : (edge.dataset.edgeFrom === String(ruleId) || edge.dataset.edgeTo === String(ruleId));
      edge.classList.toggle('edge-active', !!on);
    });
    surface.querySelectorAll('.aj-result-node').forEach(function (node) {
      var id = node.dataset.ruleId;
      var on = edgeParts
        ? (id === edgeParts[0] || id === edgeParts[1])
        : id === String(ruleId);
      node.classList.toggle('node-active', !!on);
    });
  }
  function appendResultTopoSurface(canvas, surface, layout) {
    var stage = document.createElement('div');
    stage.className = 'aj-result-stage';
    stage.style.width = Math.ceil(layout.width) + 'px';
    stage.style.height = Math.ceil(layout.height) + 'px';
    surface.style.transform = 'none';
    stage.appendChild(surface);
    canvas.appendChild(stage);
  }
  function appendResultArrow(svg, route, edge) {
    var arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    var x = route.x2, tailY = route.y2, tipY = route.arrowTipY;
    arrow.setAttribute('class', 'aj-result-arrow');
    arrow.setAttribute('points', x + ' ' + tipY + ' ' + (x - 5) + ' ' + tailY + ' ' + (x + 5) + ' ' + tailY);
    arrow.dataset.edgeKey = resultEdgeKey(edge.from, edge.to);
    arrow.dataset.edgeFrom = edge.from;
    arrow.dataset.edgeTo = edge.to;
    svg.appendChild(arrow);
  }
  function renderJudgeDetails(snap) {
    var rulesBox = document.getElementById('judgeModalRules');
    if (!rulesBox) return;
    if (!snap.rules || !snap.rules.length) { rulesBox.innerHTML = '<div class="text-muted text-center py-5">暂无评分规则。</div>'; return; }
    rulesBox.innerHTML = '';
    snap.rules.forEach(function (r) {
      var b = BADGE[r.effective] || BADGE.pending;
      var div = document.createElement('div');
      div.className = 'border rounded p-3 mb-2';
      var title = '<strong>规则 ' + r.rule_id + '</strong>';
      if (r.rule_name) title += ' <span class="text-muted small">' + esc(r.rule_name) + '</span>';
      var head =
        '<div class="d-flex justify-content-between align-items-start gap-3">' +
        '<div><span class="badge me-2" style="color:' + b[1] + ';background:' + b[2] + ';border-radius:4px;">' + b[0] + '</span>' +
        title + ' <span class="text-muted small">(' + r.value + ' 分)</span>' +
        '<div class="aj-md small mt-1">' + (r.rule_html || esc(r.rule_text)) + '</div></div>' +
        '<div class="text-end fw-semibold" style="white-space:nowrap;">' + (r.score || 0) + ' 分</div></div>';
      var ev = (r.evidence_html || r.evidence)
        ? '<details class="mt-2"><summary class="small text-muted">评分证据</summary>' +
          '<div class="aj-md aj-evi small p-2 mt-1 mb-0">' + (r.evidence_html || esc(r.evidence)) + '</div></details>'
        : '';
      div.innerHTML = head + ev;
      rulesBox.appendChild(div);
    });
  }
  function renderJudgeTopo(snap) {
    var topo = document.getElementById('judgeModalTopo');
    if (!topo) return;
    if (!snap.rules || !snap.rules.length) { topo.innerHTML = '<div class="aj-result-topo-empty">暂无评分规则。</div>'; return; }
    var layout = topoLayoutForRules(snap.rules);
    if (!layout) { topo.innerHTML = '<div class="aj-result-topo-empty text-danger">当前依赖存在环，无法生成拓扑图。</div>'; return; }
    var wrap = document.createElement('div');
    wrap.className = 'aj-result-topo-main';
    var canvas = document.createElement('div');
    canvas.className = 'aj-result-topo-canvas';
    var surface = document.createElement('div');
    surface.className = 'aj-result-surface';
    surface.style.width = layout.width + 'px';
    surface.style.height = layout.height + 'px';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'aj-result-svg');
    svg.setAttribute('width', layout.width);
    svg.setAttribute('height', layout.height);
    svg.setAttribute('viewBox', '0 0 ' + layout.width + ' ' + layout.height);
    svg.innerHTML = '';
    surface.appendChild(svg);
    var edges = [];
    snap.rules.forEach(function (r) {
      (r.dependencies || []).forEach(function (dep) {
        edges.push({from: dep, to: r.rule_id});
      });
    });
    var edgeRoutes = buildResultEdgeRoutes(edges, layout);
    edges.forEach(function (edge) {
      var route = edgeRoutes[resultEdgeKey(edge.from, edge.to)];
      if (!route) return;
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('class', 'aj-result-edge');
      path.setAttribute('d', resultEdgePath(route));
      path.dataset.edgeKey = resultEdgeKey(edge.from, edge.to);
      path.dataset.edgeFrom = edge.from;
      path.dataset.edgeTo = edge.to;
      svg.appendChild(path);
      appendResultArrow(svg, route, edge);
      var hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      hit.setAttribute('class', 'aj-result-edge-hit');
      hit.setAttribute('d', path.getAttribute('d'));
      hit.dataset.edgeKey = path.dataset.edgeKey;
      hit.dataset.edgeFrom = edge.from;
      hit.dataset.edgeTo = edge.to;
      svg.appendChild(hit);
    });
    snap.rules.forEach(function (r) {
      var pos = layout.positions[r.rule_id];
      var b = BADGE[r.effective] || BADGE.pending;
      var node = document.createElement('button');
      node.type = 'button';
      node.className = 'aj-result-node s-' + (r.effective || 'pending');
      node.dataset.ruleId = r.rule_id;
      node.title = r.rule_text || '未填写规则内容';
      node.style.left = pos.x + 'px';
      node.style.top = pos.y + 'px';
      node.innerHTML =
        '<span class="aj-result-node-id">规则 ' + r.rule_id + ' · ' + (r.value || 0) + ' 分</span>' +
        '<span class="aj-result-node-title">' + esc(resultRuleTitle(r)) + '</span>' +
        '<span class="aj-result-node-text">' + esc(compactRuleText(r.rule_text, 42)) + '</span>' +
        '<span class="aj-result-node-foot">' +
          '<span class="aj-result-status" style="color:' + b[1] + ';background:' + b[2] + ';">' + b[0] + '</span>' +
          '<span class="aj-result-score">' + (r.score || 0) + '/' + (r.value || 0) + '</span>' +
        '</span>';
      surface.appendChild(node);
    });
    wrap.appendChild(canvas);
    topo.innerHTML = '';
    topo.appendChild(wrap);
    canvas.innerHTML = '';
    appendResultTopoSurface(canvas, surface, layout);
    surface.querySelectorAll('.aj-result-edge-hit').forEach(function (edge) {
      edge.onmouseenter = function () { setResultTopoFocus(surface, null, edge.dataset.edgeKey); };
      edge.onmouseleave = function () { setResultTopoFocus(surface, null, null); };
    });
    surface.querySelectorAll('[data-rule-id]').forEach(function (n) {
      n.onmouseenter = function () { setResultTopoFocus(surface, parseInt(n.dataset.ruleId, 10), null); };
      n.onmouseleave = function () { setResultTopoFocus(surface, null, null); };
      n.onfocus = function () { setResultTopoFocus(surface, parseInt(n.dataset.ruleId, 10), null); };
      n.onblur = function () { setResultTopoFocus(surface, null, null); };
      n.onclick = function () { openJudgeRulePopup(parseInt(n.dataset.ruleId, 10)); };
    });
  }
  function renderJudgeResultViews(snap) {
    currentJudgeSnapshot = snap;
    renderJudgeTopo(snap);
    renderJudgeDetails(snap);
    setJudgeView(currentJudgeView || 'topo');
    var targets = [];
    var topo = document.getElementById('judgeModalTopo');
    var rulesBox = document.getElementById('judgeModalRules');
    if (topo) targets.push(topo);
    if (rulesBox) targets.push(rulesBox);
    if (window.MathJax && MathJax.typesetPromise && targets.length) { MathJax.typesetPromise(targets).catch(function () {}); }
  }
  function openJudgeRulePopup(ruleId) {
    if (!currentJudgeSnapshot || !currentJudgeSnapshot.rules) return;
    var r = currentJudgeSnapshot.rules.filter(function (it) { return parseInt(it.rule_id, 10) === ruleId; })[0];
    if (!r) return;
    var popup = document.getElementById('judgeRuleReadPopup');
    if (!popup) return;
    var b = BADGE[r.effective] || BADGE.pending;
    document.getElementById('judgeRuleReadTitle').textContent = '规则 ' + r.rule_id + ' · ' + resultRuleTitle(r);
    document.getElementById('judgeRuleReadMeta').innerHTML =
      '<span class="badge me-2" style="color:' + b[1] + ';background:' + b[2] + ';border-radius:999px;">' + b[0] + '</span>' +
      '<span>得分 ' + (r.score || 0) + ' / ' + (r.value || 0) + '</span>';
    document.getElementById('judgeRuleReadRule').innerHTML = r.rule_html || esc(r.rule_text);
    document.getElementById('judgeRuleReadEvidence').innerHTML =
      (r.evidence_html || r.evidence) ? (r.evidence_html || esc(r.evidence)) : '<span class="text-muted">暂无评分证据。</span>';
    popup.hidden = false;
    if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([popup]).catch(function () {}); }
  }
  function closeJudgeRulePopup() {
    var popup = document.getElementById('judgeRuleReadPopup');
    if (popup) popup.hidden = true;
  }
  function renderJudgeSnapshot(snap) {
    var total = document.getElementById('judgeModalTotal');
    var max = document.getElementById('judgeModalMax');
    var status = document.getElementById('judgeModalStatus');
    var bar = document.getElementById('judgeModalBar');
    if (total) total.textContent = snap.total_score || 0;
    if (max) max.textContent = snap.max_score || 0;
    if (status) status.textContent = (STATUS[snap.status] || snap.status || '评测状态未知') + (snap.timed_out ? ' · 已超时，保留已有得分' : '');
    if (bar) { var pct = snap.max_score ? (snap.total_score / snap.max_score * 100) : 0; bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; }
    renderJudgeResultViews(snap);
  }
  function openJudgeModal(btn) {
    var m = getModal();
    if (!btn || !m) return;
    closeJudgeStream();
    var sid = btn.getAttribute('data-submission-id') || '';
    var createdAt = btn.getAttribute('data-created-at') || '';
    var streamUrl = btn.getAttribute('data-stream-url');
    var meta = document.getElementById('judgeModalMeta');
    var status = document.getElementById('judgeModalStatus');
    var rulesBox = document.getElementById('judgeModalRules');
    var topoBox = document.getElementById('judgeModalTopo');
    var bar = document.getElementById('judgeModalBar');
    currentJudgeSnapshot = null;
    currentJudgeView = 'topo';
    setJudgeView('topo');
    closeJudgeRulePopup();
    document.getElementById('judgeModalTotal').textContent = '0';
    document.getElementById('judgeModalMax').textContent = '0';
    if (bar) bar.style.width = '0%';
    if (meta) meta.textContent = '#' + sid + (createdAt ? ' · ' + createdAt : '');
    if (status) status.textContent = '正在连接评测进度…';
    if (topoBox) topoBox.innerHTML = '<div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分拓扑…</div>';
    if (rulesBox) rulesBox.innerHTML = '<div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…</div>';
    m.show();
    if (!streamUrl || !window.EventSource) { if (status) status.textContent = '当前浏览器不支持实时进度，请刷新页面后重试。'; return; }
    judgeSource = new EventSource(streamUrl);
    judgeSource.addEventListener('progress', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); });
    judgeSource.addEventListener('done', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); closeJudgeStream(); });
    judgeSource.addEventListener('timeout', function () { if (status) status.textContent = '实时连接超时，请关闭弹窗后重试。'; closeJudgeStream(); });
    judgeSource.addEventListener('error', function () { if (status) status.textContent = '实时连接中断，请关闭弹窗后重试。'; closeJudgeStream(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.judge-detail-btn') : null;
    if (b) { e.preventDefault(); openJudgeModal(b); }
  });
  document.querySelectorAll('[data-judge-view]').forEach(function (tab) {
    tab.addEventListener('click', function () { setJudgeView(tab.dataset.judgeView); });
  });
  var ruleReadClose = document.getElementById('judgeRuleReadClose');
  if (ruleReadClose) ruleReadClose.addEventListener('click', closeJudgeRulePopup);
  var ruleReadPopup = document.getElementById('judgeRuleReadPopup');
  if (ruleReadPopup) {
    ruleReadPopup.addEventListener('click', function (e) {
      if (e.target === ruleReadPopup) closeJudgeRulePopup();
    });
  }
  if (judgeModalEl) judgeModalEl.addEventListener('hidden.bs.modal', closeJudgeStream);
})();
</script>

{# Agent 评测「评分详情」弹窗 + 实时进度。供「我的历史提交」「所有提交」共用。
   通过事件委托监听 .judge-detail-btn（含 AJAX 动态加载的按钮）。 #}
<div class="modal fade" id="judgeDetailModal" tabindex="-1" aria-labelledby="judgeDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="judgeDetailModalLabel">
            <i class="fas fa-list-check me-2 text-warning"></i>评分详情
          </h5>
          <div class="text-muted small" id="judgeModalMeta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="small text-muted" id="judgeModalStatus">正在连接评测进度…</span>
          <span class="small text-muted">得分
            <span class="fw-semibold" id="judgeModalTotal">0</span>
            / <span id="judgeModalMax">0</span>
          </span>
        </div>
        <div class="progress mb-3" style="height:6px;background:#f0f0f2;border-radius:999px;">
          <div class="progress-bar" id="judgeModalBar" role="progressbar"
               style="height:6px;border-radius:999px;background:#1f7a4d;width:0%;"></div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="aj-result-tabs" role="tablist" aria-label="评分结果视图">
            <button type="button" class="aj-result-tab active" data-judge-view="topo" role="tab" aria-selected="true">拓扑</button>
            <button type="button" class="aj-result-tab" data-judge-view="detail" role="tab" aria-selected="false">详情</button>
          </div>
          <span class="small text-muted">点击拓扑节点查看规则原文与评分证据</span>
        </div>
        <div id="judgeModalTopo" class="aj-result-view">
          <div class="text-muted text-center py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分拓扑…
          </div>
        </div>
        <div id="judgeModalRules" class="aj-result-view" hidden>
          <div class="text-muted text-center py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="aj-result-pop" id="judgeRuleReadPopup" hidden>
  <div class="aj-result-pop-box" role="dialog" aria-modal="true" aria-labelledby="judgeRuleReadTitle">
    <div class="aj-result-pop-head">
      <div>
        <div class="aj-result-pop-title" id="judgeRuleReadTitle">规则详情</div>
        <div class="aj-result-pop-meta" id="judgeRuleReadMeta"></div>
      </div>
      <button type="button" class="aj-result-pop-close" id="judgeRuleReadClose" aria-label="关闭"><i class="fas fa-times"></i></button>
    </div>
    <div class="aj-result-pop-body">
      <div class="aj-result-pop-section">
        <div class="aj-result-pop-label">规则原文</div>
        <div class="aj-md small" id="judgeRuleReadRule"></div>
      </div>
      <div class="aj-result-pop-section">
        <div class="aj-result-pop-label">评分证据</div>
        <div class="aj-md aj-evi small p-2" id="judgeRuleReadEvidence"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  if (window.__ajJudgeModalInit) return;
  window.__ajJudgeModalInit = true;
  var judgeModalEl = document.getElementById('judgeDetailModal');
  var judgeModal = null;
  function getModal() { if (!judgeModal && judgeModalEl && window.bootstrap) judgeModal = new bootstrap.Modal(judgeModalEl); return judgeModal; }
  var judgeSource = null;
  var BADGE = {
    pass: ['通过', '#1f7a4d', '#e9f3ec'],
    failed: ['未通过', '#b03a2e', '#f8e9e7'],
    skipped: ['依赖跳过', '#6c757d', '#f1f1f3'],
    error: ['异常', '#b07340', '#fbf0e3'],
    pending: ['待评测', '#2563cb', '#e8f0fb']
  };
  var STATUS = { Accepted: '评测完成', Error: '评测异常', Judging: '评测中', Queued: '等待评测', Pending: '待评测' };
  var currentJudgeSnapshot = null;
  var currentJudgeView = 'topo';
  var resultNodeW = 176, resultNodeH = 88, resultMarginX = 28, resultMarginY = 24, resultXGap = 220, resultYGap = 116;
  function closeJudgeStream() { if (judgeSource) { judgeSource.close(); judgeSource = null; } }
  function esc(s) { return (s || '').replace(/[&<>]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]; }); }
  function compactRuleText(s, n) {
    s = String(s || '').replace(/\s+/g, ' ').trim();
    if (!s) return '未填写规则内容';
    return s.length > n ? s.slice(0, n) + '…' : s;
  }
  function resultRuleTitle(r) { return (r.rule_name || '').trim() || compactRuleText(r.rule_text, 14); }
  function setJudgeView(view) {
    currentJudgeView = view || 'topo';
    document.querySelectorAll('[data-judge-view]').forEach(function (tab) {
      var on = tab.dataset.judgeView === currentJudgeView;
      tab.classList.toggle('active', on);
      tab.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    var topo = document.getElementById('judgeModalTopo');
    var detail = document.getElementById('judgeModalRules');
    if (topo) topo.hidden = currentJudgeView !== 'topo';
    if (detail) detail.hidden = currentJudgeView !== 'detail';
  }
  function topoLayoutForRules(rules) {
    var indeg = {}, adj = {};
    rules.forEach(function (r) { indeg[r.rule_id] = 0; adj[r.rule_id] = []; });
    rules.forEach(function (r) {
      (r.dependencies || []).forEach(function (d) {
        if (adj[d]) { adj[d].push(r.rule_id); indeg[r.rule_id] += 1; }
      });
    });
    var queue = Object.keys(indeg).map(Number).filter(function (id) { return indeg[id] === 0; }).sort(function (a, b) { return a - b; });
    var order = [], level = {};
    rules.forEach(function (r) { level[r.rule_id] = 0; });
    while (queue.length) {
      var id = queue.shift();
      order.push(id);
      (adj[id] || []).sort(function (a, b) { return a - b; }).forEach(function (nxt) {
        level[nxt] = Math.max(level[nxt], level[id] + 1);
        indeg[nxt] -= 1;
        if (indeg[nxt] === 0) {
          queue.push(nxt);
          queue.sort(function (a, b) { return a - b; });
        }
      });
    }
    if (order.length !== rules.length) return null;
    var cols = {}, maxLevel = 0, maxRows = 1;
    order.forEach(function (id) {
      var lv = level[id] || 0;
      maxLevel = Math.max(maxLevel, lv);
      if (!cols[lv]) cols[lv] = [];
      cols[lv].push(id);
    });
    var positions = {};
    Object.keys(cols).map(Number).sort(function (a, b) { return a - b; }).forEach(function (lv) {
      cols[lv].sort(function (a, b) { return a - b; });
      maxRows = Math.max(maxRows, cols[lv].length);
      cols[lv].forEach(function (id, row) {
        positions[id] = {
          x: resultMarginX + lv * (resultNodeW + resultXGap),
          y: resultMarginY + row * (resultNodeH + resultYGap)
        };
      });
    });
    return {
      positions: positions,
      width: resultMarginX * 2 + (maxLevel + 1) * resultNodeW + maxLevel * resultXGap,
      height: resultMarginY * 2 + maxRows * resultNodeH + (maxRows - 1) * resultYGap
    };
  }
  function resultEdgePath(a, b) {
    var x1 = a.x + resultNodeW, y1 = a.y + resultNodeH / 2;
    var x2 = b.x, y2 = b.y + resultNodeH / 2;
    var c = Math.max(70, Math.abs(x2 - x1) * 0.45);
    return 'M ' + x1 + ' ' + y1 + ' C ' + (x1 + c) + ' ' + y1 + ', ' + (x2 - c) + ' ' + y2 + ', ' + x2 + ' ' + y2;
  }
  function renderJudgeDetails(snap) {
    var rulesBox = document.getElementById('judgeModalRules');
    if (!rulesBox) return;
    if (!snap.rules || !snap.rules.length) { rulesBox.innerHTML = '<div class="text-muted text-center py-5">暂无评分规则。</div>'; return; }
    rulesBox.innerHTML = '';
    snap.rules.forEach(function (r) {
      var b = BADGE[r.effective] || BADGE.pending;
      var div = document.createElement('div');
      div.className = 'border rounded p-3 mb-2';
      var title = '<strong>规则 ' + r.rule_id + '</strong>';
      if (r.rule_name) title += ' <span class="text-muted small">' + esc(r.rule_name) + '</span>';
      var head =
        '<div class="d-flex justify-content-between align-items-start gap-3">' +
        '<div><span class="badge me-2" style="color:' + b[1] + ';background:' + b[2] + ';border-radius:4px;">' + b[0] + '</span>' +
        title + ' <span class="text-muted small">(' + r.value + ' 分)</span>' +
        '<div class="aj-md small mt-1">' + (r.rule_html || esc(r.rule_text)) + '</div></div>' +
        '<div class="text-end fw-semibold" style="white-space:nowrap;">' + (r.score || 0) + ' 分</div></div>';
      var ev = (r.evidence_html || r.evidence)
        ? '<details class="mt-2"><summary class="small text-muted">评分证据</summary>' +
          '<div class="aj-md aj-evi small p-2 mt-1 mb-0">' + (r.evidence_html || esc(r.evidence)) + '</div></details>'
        : '';
      div.innerHTML = head + ev;
      rulesBox.appendChild(div);
    });
  }
  function renderJudgeTopo(snap) {
    var topo = document.getElementById('judgeModalTopo');
    if (!topo) return;
    if (!snap.rules || !snap.rules.length) { topo.innerHTML = '<div class="aj-result-topo-empty">暂无评分规则。</div>'; return; }
    var layout = topoLayoutForRules(snap.rules);
    if (!layout) { topo.innerHTML = '<div class="aj-result-topo-empty text-danger">当前依赖存在环，无法生成拓扑图。</div>'; return; }
    var wrap = document.createElement('div');
    wrap.className = 'aj-result-topo-main';
    var canvas = document.createElement('div');
    canvas.className = 'aj-result-topo-canvas';
    var surface = document.createElement('div');
    surface.className = 'aj-result-surface';
    surface.style.width = layout.width + 'px';
    surface.style.height = layout.height + 'px';
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'aj-result-svg');
    svg.setAttribute('width', layout.width);
    svg.setAttribute('height', layout.height);
    svg.setAttribute('viewBox', '0 0 ' + layout.width + ' ' + layout.height);
    svg.innerHTML = '<defs><marker id="ajResultArrowShared" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b9aa7b"></path></marker></defs>';
    surface.appendChild(svg);
    snap.rules.forEach(function (r) {
      (r.dependencies || []).forEach(function (dep) {
        var from = layout.positions[dep], to = layout.positions[r.rule_id];
        if (!from || !to) return;
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('class', 'aj-result-edge');
        path.setAttribute('d', resultEdgePath(from, to));
        path.setAttribute('marker-end', 'url(#ajResultArrowShared)');
        svg.appendChild(path);
      });
    });
    snap.rules.forEach(function (r) {
      var pos = layout.positions[r.rule_id];
      var b = BADGE[r.effective] || BADGE.pending;
      var node = document.createElement('button');
      node.type = 'button';
      node.className = 'aj-result-node s-' + (r.effective || 'pending');
      node.dataset.ruleId = r.rule_id;
      node.title = r.rule_text || '未填写规则内容';
      node.style.left = pos.x + 'px';
      node.style.top = pos.y + 'px';
      node.innerHTML =
        '<span class="aj-result-node-id">规则 ' + r.rule_id + '</span>' +
        '<span class="aj-result-node-title">' + esc(resultRuleTitle(r)) + '</span>' +
        '<span class="aj-result-node-text">' + esc(compactRuleText(r.rule_text, 42)) + '</span>' +
        '<span class="aj-result-node-foot">' +
          '<span class="aj-result-status" style="color:' + b[1] + ';background:' + b[2] + ';">' + b[0] + '</span>' +
          '<span class="aj-result-score">' + (r.score || 0) + '/' + (r.value || 0) + '</span>' +
        '</span>';
      surface.appendChild(node);
    });
    canvas.appendChild(surface);
    wrap.appendChild(canvas);
    topo.innerHTML = '';
    topo.appendChild(wrap);
    topo.querySelectorAll('[data-rule-id]').forEach(function (n) {
      n.onclick = function () { openJudgeRulePopup(parseInt(n.dataset.ruleId, 10)); };
    });
  }
  function renderJudgeResultViews(snap) {
    currentJudgeSnapshot = snap;
    renderJudgeTopo(snap);
    renderJudgeDetails(snap);
    setJudgeView(currentJudgeView || 'topo');
    var targets = [];
    var topo = document.getElementById('judgeModalTopo');
    var rulesBox = document.getElementById('judgeModalRules');
    if (topo) targets.push(topo);
    if (rulesBox) targets.push(rulesBox);
    if (window.MathJax && MathJax.typesetPromise && targets.length) { MathJax.typesetPromise(targets).catch(function () {}); }
  }
  function openJudgeRulePopup(ruleId) {
    if (!currentJudgeSnapshot || !currentJudgeSnapshot.rules) return;
    var r = currentJudgeSnapshot.rules.filter(function (it) { return parseInt(it.rule_id, 10) === ruleId; })[0];
    if (!r) return;
    var popup = document.getElementById('judgeRuleReadPopup');
    if (!popup) return;
    var b = BADGE[r.effective] || BADGE.pending;
    document.getElementById('judgeRuleReadTitle').textContent = '规则 ' + r.rule_id + ' · ' + resultRuleTitle(r);
    document.getElementById('judgeRuleReadMeta').innerHTML =
      '<span class="badge me-2" style="color:' + b[1] + ';background:' + b[2] + ';border-radius:999px;">' + b[0] + '</span>' +
      '<span>得分 ' + (r.score || 0) + ' / ' + (r.value || 0) + '</span>';
    document.getElementById('judgeRuleReadRule').innerHTML = r.rule_html || esc(r.rule_text);
    document.getElementById('judgeRuleReadEvidence').innerHTML =
      (r.evidence_html || r.evidence) ? (r.evidence_html || esc(r.evidence)) : '<span class="text-muted">暂无评分证据。</span>';
    popup.hidden = false;
    if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([popup]).catch(function () {}); }
  }
  function closeJudgeRulePopup() {
    var popup = document.getElementById('judgeRuleReadPopup');
    if (popup) popup.hidden = true;
  }
  function renderJudgeSnapshot(snap) {
    var total = document.getElementById('judgeModalTotal');
    var max = document.getElementById('judgeModalMax');
    var status = document.getElementById('judgeModalStatus');
    var bar = document.getElementById('judgeModalBar');
    if (total) total.textContent = snap.total_score || 0;
    if (max) max.textContent = snap.max_score || 0;
    if (status) status.textContent = (STATUS[snap.status] || snap.status || '评测状态未知') + (snap.timed_out ? ' · 已超时，保留已有得分' : '');
    if (bar) { var pct = snap.max_score ? (snap.total_score / snap.max_score * 100) : 0; bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; }
    renderJudgeResultViews(snap);
  }
  function openJudgeModal(btn) {
    var m = getModal();
    if (!btn || !m) return;
    closeJudgeStream();
    var sid = btn.getAttribute('data-submission-id') || '';
    var createdAt = btn.getAttribute('data-created-at') || '';
    var streamUrl = btn.getAttribute('data-stream-url');
    var meta = document.getElementById('judgeModalMeta');
    var status = document.getElementById('judgeModalStatus');
    var rulesBox = document.getElementById('judgeModalRules');
    var topoBox = document.getElementById('judgeModalTopo');
    var bar = document.getElementById('judgeModalBar');
    currentJudgeSnapshot = null;
    currentJudgeView = 'topo';
    setJudgeView('topo');
    closeJudgeRulePopup();
    document.getElementById('judgeModalTotal').textContent = '0';
    document.getElementById('judgeModalMax').textContent = '0';
    if (bar) bar.style.width = '0%';
    if (meta) meta.textContent = '#' + sid + (createdAt ? ' · ' + createdAt : '');
    if (status) status.textContent = '正在连接评测进度…';
    if (topoBox) topoBox.innerHTML = '<div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分拓扑…</div>';
    if (rulesBox) rulesBox.innerHTML = '<div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…</div>';
    m.show();
    if (!streamUrl || !window.EventSource) { if (status) status.textContent = '当前浏览器不支持实时进度，请刷新页面后重试。'; return; }
    judgeSource = new EventSource(streamUrl);
    judgeSource.addEventListener('progress', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); });
    judgeSource.addEventListener('done', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); closeJudgeStream(); });
    judgeSource.addEventListener('timeout', function () { if (status) status.textContent = '实时连接超时，请关闭弹窗后重试。'; closeJudgeStream(); });
    judgeSource.addEventListener('error', function () { if (status) status.textContent = '实时连接中断，请关闭弹窗后重试。'; closeJudgeStream(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.judge-detail-btn') : null;
    if (b) { e.preventDefault(); openJudgeModal(b); }
  });
  document.querySelectorAll('[data-judge-view]').forEach(function (tab) {
    tab.addEventListener('click', function () { setJudgeView(tab.dataset.judgeView); });
  });
  var ruleReadClose = document.getElementById('judgeRuleReadClose');
  if (ruleReadClose) ruleReadClose.addEventListener('click', closeJudgeRulePopup);
  var ruleReadPopup = document.getElementById('judgeRuleReadPopup');
  if (ruleReadPopup) {
    ruleReadPopup.addEventListener('click', function (e) {
      if (e.target === ruleReadPopup) closeJudgeRulePopup();
    });
  }
  if (judgeModalEl) judgeModalEl.addEventListener('hidden.bs.modal', closeJudgeStream);
})();
</script>

{# Agent 评测「评分详情」弹窗 + 实时进度。供「我的历史提交」「所有提交」共用。
   通过事件委托监听 .judge-detail-btn（含 AJAX 动态加载的按钮）。 #}
<div class="modal fade" id="judgeDetailModal" tabindex="-1" aria-labelledby="judgeDetailModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h5 class="modal-title" id="judgeDetailModalLabel">
            <i class="fas fa-list-check me-2 text-warning"></i>评分详情
          </h5>
          <div class="text-muted small" id="judgeModalMeta"></div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <div class="modal-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span class="small text-muted" id="judgeModalStatus">正在连接评测进度…</span>
          <span class="small text-muted">得分
            <span class="fw-semibold" id="judgeModalTotal">0</span>
            / <span id="judgeModalMax">0</span>
          </span>
        </div>
        <div class="progress mb-3" style="height:6px;background:#f0f0f2;border-radius:999px;">
          <div class="progress-bar" id="judgeModalBar" role="progressbar"
               style="height:6px;border-radius:999px;background:#1f7a4d;width:0%;"></div>
        </div>
        <div id="judgeModalRules">
          <div class="text-muted text-center py-5">
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  if (window.__ajJudgeModalInit) return;
  window.__ajJudgeModalInit = true;
  var judgeModalEl = document.getElementById('judgeDetailModal');
  var judgeModal = null;
  function getModal() { if (!judgeModal && judgeModalEl && window.bootstrap) judgeModal = new bootstrap.Modal(judgeModalEl); return judgeModal; }
  var judgeSource = null;
  var BADGE = {
    pass: ['通过', '#1f7a4d', '#e9f3ec'],
    failed: ['未通过', '#b03a2e', '#f8e9e7'],
    skipped: ['依赖跳过', '#6c757d', '#f1f1f3'],
    error: ['异常', '#b07340', '#fbf0e3'],
    pending: ['待评测', '#2563cb', '#e8f0fb']
  };
  var STATUS = { Accepted: '评测完成', Error: '评测异常', Judging: '评测中', Queued: '等待评测', Pending: '待评测' };
  function closeJudgeStream() { if (judgeSource) { judgeSource.close(); judgeSource = null; } }
  function esc(s) { return (s || '').replace(/[&<>]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c]; }); }
  function renderJudgeSnapshot(snap) {
    var total = document.getElementById('judgeModalTotal');
    var max = document.getElementById('judgeModalMax');
    var status = document.getElementById('judgeModalStatus');
    var bar = document.getElementById('judgeModalBar');
    var rulesBox = document.getElementById('judgeModalRules');
    if (total) total.textContent = snap.total_score || 0;
    if (max) max.textContent = snap.max_score || 0;
    if (status) status.textContent = (STATUS[snap.status] || snap.status || '评测状态未知') + (snap.timed_out ? ' · 已超时，保留已有得分' : '');
    if (bar) { var pct = snap.max_score ? (snap.total_score / snap.max_score * 100) : 0; bar.style.width = Math.max(0, Math.min(100, pct)) + '%'; }
    if (!rulesBox) return;
    if (!snap.rules || !snap.rules.length) { rulesBox.innerHTML = '<div class="text-muted text-center py-5">暂无评分规则。</div>'; return; }
    rulesBox.innerHTML = '';
    snap.rules.forEach(function (r) {
      var b = BADGE[r.effective] || BADGE.pending;
      var div = document.createElement('div');
      div.className = 'border rounded p-3 mb-2';
      var head =
        '<div class="d-flex justify-content-between align-items-start gap-3">' +
        '<div><span class="badge me-2" style="color:' + b[1] + ';background:' + b[2] + ';border-radius:4px;">' + b[0] + '</span>' +
        '<strong>规则 ' + r.rule_id + '</strong> <span class="text-muted small">(' + r.value + ' 分)</span>' +
        '<div class="aj-md small mt-1">' + (r.rule_html || esc(r.rule_text)) + '</div></div>' +
        '<div class="text-end fw-semibold" style="white-space:nowrap;">' + (r.score || 0) + ' 分</div></div>';
      var ev = (r.evidence_html || r.evidence)
        ? '<details class="mt-2"><summary class="small text-muted">评分证据</summary>' +
          '<div class="aj-md aj-evi small p-2 mt-1 mb-0">' + (r.evidence_html || esc(r.evidence)) + '</div></details>'
        : '';
      div.innerHTML = head + ev;
      rulesBox.appendChild(div);
    });
    if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([rulesBox]).catch(function () {}); }
  }
  function openJudgeModal(btn) {
    var m = getModal();
    if (!btn || !m) return;
    closeJudgeStream();
    var sid = btn.getAttribute('data-submission-id') || '';
    var createdAt = btn.getAttribute('data-created-at') || '';
    var streamUrl = btn.getAttribute('data-stream-url');
    var meta = document.getElementById('judgeModalMeta');
    var status = document.getElementById('judgeModalStatus');
    var rulesBox = document.getElementById('judgeModalRules');
    var bar = document.getElementById('judgeModalBar');
    document.getElementById('judgeModalTotal').textContent = '0';
    document.getElementById('judgeModalMax').textContent = '0';
    if (bar) bar.style.width = '0%';
    if (meta) meta.textContent = '#' + sid + (createdAt ? ' · ' + createdAt : '');
    if (status) status.textContent = '正在连接评测进度…';
    if (rulesBox) rulesBox.innerHTML = '<div class="text-muted text-center py-5"><span class="spinner-border spinner-border-sm me-2" role="status"></span>正在加载评分细则…</div>';
    m.show();
    if (!streamUrl || !window.EventSource) { if (status) status.textContent = '当前浏览器不支持实时进度，请刷新页面后重试。'; return; }
    judgeSource = new EventSource(streamUrl);
    judgeSource.addEventListener('progress', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); });
    judgeSource.addEventListener('done', function (e) { renderJudgeSnapshot(JSON.parse(e.data)); closeJudgeStream(); });
    judgeSource.addEventListener('timeout', function () { if (status) status.textContent = '实时连接超时，请关闭弹窗后重试。'; closeJudgeStream(); });
    judgeSource.addEventListener('error', function () { if (status) status.textContent = '实时连接中断，请关闭弹窗后重试。'; closeJudgeStream(); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.judge-detail-btn') : null;
    if (b) { e.preventDefault(); openJudgeModal(b); }
  });
  if (judgeModalEl) judgeModalEl.addEventListener('hidden.bs.modal', closeJudgeStream);
})();
</script>

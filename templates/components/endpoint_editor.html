{% macro endpoint_editor(id_prefix, mode='global', title='新建端点', surface='modal') -%}
<form class="numoj-endpoint-editor{% if surface == 'modal' %} modal-content{% else %} numoj-endpoint-editor--layer{% endif %}"
      data-endpoint-editor data-endpoint-editor-mode="{{ mode }}" data-endpoint-editor-surface="{{ surface }}"
      autocomplete="off" novalidate>
  <header class="numoj-endpoint-editor__header">
    <div><p>ENDPOINT EDITOR</p><h2 id="{{ id_prefix }}-title" data-endpoint-editor-title tabindex="-1">{{ title }}</h2></div>
    <button type="button" class="btn-close" aria-label="关闭"
            {% if surface == 'modal' %}data-bs-dismiss="modal"{% else %}data-endpoint-editor-dismiss{% endif %}></button>
  </header>
  <div class="numoj-endpoint-editor__body">
    <input type="hidden" name="endpoint_id">
    <input type="hidden" name="name" value="" disabled>
    <label class="wide"><span>模型名称</span><input name="model" maxlength="200" required autocomplete="off"></label>
    <label><span>上下文窗口</span><input name="context_window_tokens" type="number" min="1" max="2147483647" step="1" inputmode="numeric" value="384000" required></label>
    <label><span>单次最大输出</span><input name="max_output_tokens" type="number" min="1" max="2147483647" step="1" inputmode="numeric" value="32000" required></label>
    <label>
      <span>兼容协议</span>
      <div class="rk-choice numoj-endpoint-editor__choice" data-endpoint-editor-choice="protocol">
        <input class="rk-choice-value" type="hidden" name="protocol" value="openai" data-choice-required="true">
        <button class="rk-choice-trigger" id="{{ id_prefix }}-protocol-trigger" type="button" role="combobox"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ id_prefix }}-protocol-menu">
          <span class="rk-choice-trigger-main"><i class="fas fa-code" data-rk-choice-icon aria-hidden="true"></i><span data-rk-choice-label></span></span>
          <i class="fas fa-chevron-down rk-choice-caret" aria-hidden="true"></i>
        </button>
        <div class="rk-choice-menu" id="{{ id_prefix }}-protocol-menu" role="listbox" aria-labelledby="{{ id_prefix }}-protocol-trigger"></div>
      </div>
    </label>
    <label>
      <span>能力类别</span>
      <div class="rk-choice numoj-endpoint-editor__choice" data-endpoint-editor-choice="category">
        <input class="rk-choice-value" type="hidden" name="category" value="text" data-choice-required="true">
        <button class="rk-choice-trigger" id="{{ id_prefix }}-category-trigger" type="button" role="combobox"
                aria-haspopup="listbox" aria-expanded="false" aria-controls="{{ id_prefix }}-category-menu">
          <span class="rk-choice-trigger-main"><i class="fas fa-font" data-rk-choice-icon aria-hidden="true"></i><span data-rk-choice-label></span></span>
          <i class="fas fa-chevron-down rk-choice-caret" aria-hidden="true"></i>
        </button>
        <div class="rk-choice-menu" id="{{ id_prefix }}-category-menu" role="listbox" aria-labelledby="{{ id_prefix }}-category-trigger"></div>
      </div>
    </label>
    <label class="wide"><span>基础地址</span><input name="base_url" type="url" required autocomplete="url" placeholder="https://api.example.com/v1"></label>
    <label><span>API 密钥</span><input name="api_key" type="password" autocomplete="new-password" placeholder="sk-..."><small data-endpoint-editor-key-note></small></label>
    <label data-endpoint-editor-thinking-field>
      <span>思考模式</span>
      <button class="numoj-endpoint-editor__thinking" type="button" role="switch" aria-checked="false" data-endpoint-editor-thinking>
        <i aria-hidden="true"></i><b>关闭</b>
      </button>
      <input name="thinking_enabled" type="hidden" value="false"><input name="thinking_format" type="hidden" value="none">
    </label>
    {% if mode == 'global' %}
      <div class="numoj-endpoint-editor__prices wide">
        <label><span>输入单价（RMB / 1M Token）</span><input name="input_price_per_million" type="number" min="0" step="any" inputmode="decimal" required></label>
        <label><span>缓存命中单价（RMB / 1M Token）</span><input name="cached_input_price_per_million" type="number" min="0" step="any" inputmode="decimal" required></label>
        <label><span>输出单价（RMB / 1M Token）</span><input name="output_price_per_million" type="number" min="0" step="any" inputmode="decimal" required></label>
      </div>
    {% else %}
      <input type="hidden" name="input_price_per_million" value="">
      <input type="hidden" name="cached_input_price_per_million" value="">
      <input type="hidden" name="output_price_per_million" value="">
    {% endif %}
    <p class="numoj-endpoint-editor__result wide" data-endpoint-editor-result role="status" aria-live="polite" hidden></p>
  </div>
  <footer class="numoj-endpoint-editor__footer">
    <button class="numoj-endpoint-editor__secondary" type="button"
            {% if surface == 'modal' %}data-bs-dismiss="modal"{% else %}data-endpoint-editor-dismiss{% endif %}>放弃</button>
    <button class="numoj-endpoint-editor__secondary" type="button" data-endpoint-editor-test><i class="fas fa-vial" aria-hidden="true"></i>测试</button>
    <button class="numoj-endpoint-editor__primary" type="submit" data-endpoint-editor-save disabled>保存</button>
  </footer>
</form>
{%- endmacro %}

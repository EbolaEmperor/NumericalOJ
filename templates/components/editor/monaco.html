{# OJ 页面默认使用最小包；Repository/Agent Workspace 显式使用完整包。 #}
{% set monaco_bundle_name = monaco_bundle|default('minimal') %}
{% set monaco_asset_stem = 'editor' if monaco_bundle_name == 'full' else 'editor-minimal' %}
{% set monaco_fetch_priority_name = monaco_fetch_priority|default('auto') %}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/code-editor.css') }}">
<script src="{{ url_for('static', filename='app/editor-semantic-tokens.js') }}"></script>
<script src="{{ url_for('static', filename='app/code-editor-runtime.js') }}"></script>
<script>
  window.MonacoEnvironment = {
    getWorkerUrl: function() {
      return {{ url_for('static', filename='vendor/monaco/editor.worker.js')|tojson }};
    }
  };
  window.NumOJMonacoReady = new Promise(function(resolve) {
    var settled = false;
    var timeout = window.setTimeout(function() {
      finish(null);
    }, 8000);
    function finish(value) {
      if (settled) return;
      settled = true;
      window.clearTimeout(timeout);
      resolve(value);
    }
    var stylesheetReady = new Promise(function(done) {
      var stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.fetchPriority = {{ monaco_fetch_priority_name|tojson }};
      stylesheet.href = {{ url_for('static', filename='vendor/monaco/' ~ monaco_asset_stem ~ '.css')|tojson }};
      stylesheet.onload = done;
      stylesheet.onerror = done;
      document.head.appendChild(stylesheet);
    });
    var script = document.createElement('script');
    script.fetchPriority = {{ monaco_fetch_priority_name|tojson }};
    script.src = {{ url_for('static', filename='vendor/monaco/' ~ monaco_asset_stem ~ '.js')|tojson }};
    script.async = true;
    script.onload = function() {
      stylesheetReady.then(function() {
        finish(window.NumericalOJMonaco || null);
      });
    };
    script.onerror = function() { finish(null); };
    document.head.appendChild(script);
  });
</script>

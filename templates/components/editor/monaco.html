{# Monaco 默认仅在桌面按需加载；显式 opt-in 的编辑面在所有断点复用同一加载逻辑。 #}
<link rel="stylesheet" href="{{ url_for('static', filename='styles/code-editor.css') }}">
<script src="{{ url_for('static', filename='app/editor-semantic-tokens.js') }}"></script>
<script src="{{ url_for('static', filename='app/code-editor-runtime.js') }}"></script>
<script>
  window.MonacoEnvironment = {
    getWorkerUrl: function() {
      return {{ url_for('static', filename='vendor/monaco/editor.worker.js')|tojson }};
    }
  };
  window.NumOJMonacoReady = new Promise(function(resolve) {
    var allBreakpoints = {{ 'true' if monaco_all_breakpoints|default(false) else 'false' }};
    if (!allBreakpoints && !window.matchMedia('(min-width: 992px)').matches) {
      resolve(null);
      return;
    }
    var settled = false;
    var timeout = window.setTimeout(function() {
      finish(null);
    }, 8000);
    function finish(value) {
      if (settled) return;
      settled = true;
      window.clearTimeout(timeout);
      resolve(value);
    }
    var stylesheetReady = new Promise(function(done) {
      var stylesheet = document.createElement('link');
      stylesheet.rel = 'stylesheet';
      stylesheet.href = {{ url_for('static', filename='vendor/monaco/editor.css')|tojson }};
      stylesheet.onload = done;
      stylesheet.onerror = done;
      document.head.appendChild(stylesheet);
    });
    var script = document.createElement('script');
    script.src = {{ url_for('static', filename='vendor/monaco/editor.js')|tojson }};
    script.async = true;
    script.onload = function() {
      stylesheetReady.then(function() {
        finish(window.NumericalOJMonaco || null);
      });
    };
    script.onerror = function() { finish(null); };
    document.head.appendChild(script);
  });
</script>

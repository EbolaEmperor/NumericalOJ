{% if user and (user.is_admin == 1 or class_adjust_enabled) %}
<!-- 班级管理模态框 -->
<div class="modal fade numoj-account-modal numoj-class-modal" id="classManagerModal" tabindex="-1"
  aria-labelledby="classManagerLabel" aria-hidden="true"
  data-is-admin="{% if user and user.is_admin == 1 %}1{% else %}0{% endif %}"
  data-class-adjust-enabled="{% if class_adjust_enabled %}1{% else %}0{% endif %}"
  data-classes-url="{{ url_for('class_management.get_my_classes') }}"
  data-join-class-url="{{ url_for('class_management.join_class') }}"
  data-leave-class-url="{{ url_for('class_management.leave_class') }}"
  data-set-primary-class-url="{{ url_for('class_management.set_primary_class') }}"
  data-class-adjust-url="{{ url_for('homework.admin_class_adjust') }}">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <span class="numoj-account-modal-accent" aria-hidden="true"></span>

      <div class="modal-header">
        <div class="numoj-account-modal-title">
          <span class="numoj-account-kicker">MEMBERSHIP · CLASSES</span>
          <h2 class="modal-title" id="classManagerLabel">调整班级</h2>
        </div>

        <div class="numoj-class-header-actions">
          {% if user.is_admin == 1 %}
          <label class="numoj-class-permission" for="classAdjustSwitch">
            <input type="checkbox" id="classAdjustSwitch" {% if class_adjust_enabled %}checked{% endif %}>
            <span class="numoj-class-switch-track" aria-hidden="true"><span></span></span>
            <span id="classAdjustLabel">学生自助：{% if class_adjust_enabled %}允许{% else %}禁止{% endif %}</span>
          </label>
          {% endif %}
          <button type="button" class="numoj-account-close" data-bs-dismiss="modal" aria-label="关闭调整班级弹窗">
            <span aria-hidden="true">×</span>
          </button>
        </div>
      </div>

      <div class="modal-body numoj-account-modal-body">
        <section class="numoj-account-section" aria-labelledby="myClassesTitle">
          <div class="numoj-account-section-heading">
            <h3 id="myClassesTitle">我的班级</h3>
            <span id="classMembershipCount">正在加载</span>
          </div>
          <div class="numoj-membership-list" id="myClassesBox" aria-live="polite">
            <div class="numoj-membership-state">
              <span class="math-curve-loader" data-math-curve-loader data-size="sm">
                <span class="math-curve-loader__label">正在加载班级…</span>
              </span>
            </div>
          </div>
        </section>

        <section class="numoj-account-section" aria-labelledby="joinClassTitle">
          <div class="numoj-account-section-heading">
            <h3 id="joinClassTitle">加入新班级</h3>
            <span>AVAILABLE</span>
          </div>
          <div class="numoj-class-join-row">
            <div
              class="numoj-class-select"
              id="joinClassPicker"
              data-numoj-class-select
              data-class-select-placeholder="请选择班级"
              data-class-select-placeholder-code="AVAILABLE"
            >
              <input type="hidden" id="joinClassSelect" data-class-select-input value="">
              <button
                class="numoj-class-select-trigger"
                type="button"
                aria-haspopup="listbox"
                aria-expanded="false"
                aria-controls="joinClassOptions"
                data-class-select-trigger
              >
                <span
                  class="numoj-class-select-logo is-placeholder"
                  data-class-select-current-logo
                  aria-hidden="true"
                ></span>
                <span class="numoj-class-select-current">
                  <strong data-class-select-current-label>请选择班级</strong>
                  <small data-class-select-current-code>AVAILABLE</small>
                </span>
                <i class="fas fa-chevron-down numoj-class-select-chevron" aria-hidden="true"></i>
              </button>
              <div
                class="numoj-class-select-menu"
                id="joinClassOptions"
                role="listbox"
                aria-label="可加入的班级"
                data-class-select-menu
                hidden
              ></div>
            </div>
            <button class="numoj-account-button numoj-account-button-brand" id="joinClassBtn"
              type="button" disabled>加入班级</button>
          </div>
        </section>
      </div>

      <div class="modal-footer">
        <span class="numoj-account-footer-note">CHANGES · SAVED IMMEDIATELY</span>
        <div class="numoj-account-footer-actions">
          <button type="button" class="numoj-account-button numoj-account-button-dark"
            data-bs-dismiss="modal">完成</button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endif %}

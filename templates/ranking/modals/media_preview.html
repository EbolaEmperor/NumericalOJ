<!-- 附件图片/视频预览器（图片查看器 + 视频播放器） -->
<div class="modal fade" id="rkMediaViewer" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h5 class="modal-title text-truncate" style="max-width: 70%;">
          <i class="fas fa-photo-film me-2"></i><span id="rkMediaTitle"></span>
        </h5>
        <div class="ms-auto d-flex align-items-center gap-2">
          <a id="rkMediaDownload" class="btn btn-sm btn-outline-primary" href="#" download>
            <i class="fas fa-download me-1"></i>下载
          </a>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
      </div>
      <div class="modal-body text-center">
        <img id="rkMediaImg" class="rk-media-img" alt="" style="display:none;">
        <video id="rkMediaVideo" class="rk-media-video" controls preload="metadata" playsinline style="display:none;"></video>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('rkMediaViewer');
  if (!el || !window.bootstrap) return;
  var modal = new bootstrap.Modal(el);
  var img = document.getElementById('rkMediaImg');
  var vid = document.getElementById('rkMediaVideo');
  var titleEl = document.getElementById('rkMediaTitle');
  var dlEl = document.getElementById('rkMediaDownload');

  function reset() {
    try { vid.pause(); } catch (e) {}
    img.style.display = 'none'; img.removeAttribute('src');
    vid.style.display = 'none'; vid.removeAttribute('src'); vid.load();
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest('.rk-media-btn');
    if (!btn) return;
    e.preventDefault();
    var url = btn.getAttribute('data-media-url');
    var kind = btn.getAttribute('data-media-kind');
    var name = btn.getAttribute('data-media-name') || '';
    var dl = btn.getAttribute('data-media-dl') || url;
    reset();
    titleEl.textContent = name;
    dlEl.setAttribute('href', dl);
    if (kind === 'video') {
      vid.src = url; vid.style.display = '';
    } else {
      img.src = url; img.alt = name; img.style.display = '';
    }
    modal.show();
  });

  // 关闭时停止播放、释放资源（视频继续后台下载会浪费带宽）
  el.addEventListener('hidden.bs.modal', reset);
})();
</script>

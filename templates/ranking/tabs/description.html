    {# ========== 比赛描述 ========== #}
    {% if tab == 'description' %}
      <section class="ranking-v2-tab ranking-v2-description"
               data-ranking-tab-panel="description">
        {% if rendered_description %}
          <div class="numoj-markdown numoj-problem-code-rendering ranking-description"
               data-numoj-markdown>
            {{ rendered_description|safe }}
          </div>
        {% else %}
          <div class="ranking-v2-empty ranking-v2-empty--document">
            <i class="fas fa-file-lines" aria-hidden="true"></i>
            <strong>暂无比赛描述</strong>
            <span>赛事管理员尚未发布说明文档。</span>
          </div>
        {% endif %}
      </section>
    {% endif %}

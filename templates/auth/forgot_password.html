{% extends "auth/base.html" %}

{% block title %}找回密码 - Numerical OJ{% endblock %}
{% block auth_heading %}找回密码{% endblock %}

{% block auth_content %}
{% if step == 'email' %}
  <form class="numoj-auth-form" method="POST"
    action="{{ url_for('auth.forgot_password', step='email') }}">
    <div class="numoj-auth-field">
      <label for="email">邮箱</label>
      <span class="numoj-auth-control">
        <input id="email" name="email" type="email" autocomplete="email"
          value="{{ request.form.get('email', '') }}" placeholder="请输入注册邮箱"
          required autofocus>
      </span>
    </div>
    <button class="numoj-auth-primary" type="submit">发送验证码</button>
  </form>
{% elif step == 'verify' %}
  <p class="numoj-auth-notice">验证码已发送</p>
  <form class="numoj-auth-form" method="POST"
    action="{{ url_for('auth.forgot_password', step='verify', email=email) }}">
    <input type="hidden" name="email" value="{{ email }}">

    <div class="numoj-auth-field">
      <label for="code">验证码</label>
      <span class="numoj-auth-control">
        <input id="code" name="code" type="text" inputmode="numeric"
          autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}"
          placeholder="请输入验证码" required autofocus>
      </span>
    </div>

    <div class="numoj-auth-field">
      <label for="new_password">新密码</label>
      <span class="numoj-auth-control">
        <input id="new_password" name="new_password" type="password"
          autocomplete="new-password" placeholder="请输入新密码" required>
        <button class="numoj-auth-password-toggle" type="button"
          data-auth-password-toggle="new_password" aria-label="显示密码" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
            <circle cx="12" cy="12" r="2.6"/>
            <path class="numoj-auth-eye-slash" d="M4 4l16 16"/>
          </svg>
        </button>
      </span>
    </div>

    <div class="numoj-auth-field">
      <label for="confirm_password">确认密码</label>
      <span class="numoj-auth-control">
        <input id="confirm_password" name="confirm_password" type="password"
          autocomplete="new-password" placeholder="请再次输入新密码" required>
        <button class="numoj-auth-password-toggle" type="button"
          data-auth-password-toggle="confirm_password" aria-label="显示密码" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
            <circle cx="12" cy="12" r="2.6"/>
            <path class="numoj-auth-eye-slash" d="M4 4l16 16"/>
          </svg>
        </button>
      </span>
    </div>

    <button class="numoj-auth-primary" type="submit">重置密码</button>
  </form>
{% endif %}

<div class="numoj-auth-secondary{% if step != 'verify' %} is-centered{% endif %}">
  {% if step == 'verify' %}
    <a href="{{ url_for('auth.forgot_password') }}">修改邮箱</a>
  {% endif %}
  <a href="{{ url_for('auth.login') }}">返回登录</a>
</div>
{% endblock %}

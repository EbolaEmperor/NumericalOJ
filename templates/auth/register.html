{% extends "auth/base.html" %}
{% from 'components/layout/class_logo.html' import class_logo %}

{% block title %}注册 - Numerical OJ{% endblock %}

{% block auth_content %}
<form class="numoj-auth-form" method="POST" action="{{ url_for('auth.register') }}"
  data-auth-register-form>
  <div class="numoj-auth-field">
    <label for="email">邮箱</label>
    <span class="numoj-auth-control">
      <input id="email" name="email" type="email" autocomplete="email"
        value="{{ request.form.get('email', '') }}" placeholder="请输入邮箱" required>
    </span>
  </div>

  <div class="numoj-auth-field">
    <label for="verification_code">验证码</label>
    <span class="numoj-auth-code-row">
      <span class="numoj-auth-control">
        <input id="verification_code" name="verification_code" type="text"
          inputmode="numeric" autocomplete="one-time-code" maxlength="6"
          pattern="[0-9]{6}" value="{{ request.form.get('verification_code', '') }}"
          placeholder="请输入验证码" required>
      </span>
      <button class="numoj-auth-code-button" id="send-code-btn" type="button"
        data-auth-send-code
        data-send-code-url="{{ url_for('auth.send_verification') }}">获取验证码</button>
    </span>
    <p class="numoj-auth-field-status" data-auth-code-status aria-live="polite" hidden></p>
  </div>

  <div class="numoj-auth-field">
    <label for="username">学号</label>
    <span class="numoj-auth-control">
      <input id="username" name="username" type="text" autocomplete="username"
        value="{{ request.form.get('username', '') }}" placeholder="请输入学号" required>
    </span>
  </div>

  <div class="numoj-auth-field">
    <label for="password">密码</label>
    <span class="numoj-auth-control">
      <input id="password" name="password" type="password" autocomplete="new-password"
        placeholder="请输入密码" required>
      <button class="numoj-auth-password-toggle" type="button"
        data-auth-password-toggle="password" aria-label="显示密码" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
          <circle cx="12" cy="12" r="2.6"/>
          <path class="numoj-auth-eye-slash" d="M4 4l16 16"/>
        </svg>
      </button>
    </span>
  </div>

  <div class="numoj-auth-field">
    <label for="registerClassSelectTrigger">班级</label>
    <div
      class="numoj-class-select numoj-register-class-select"
      data-numoj-class-select
      data-class-select-auto
      data-class-select-required
      data-class-select-placeholder="请选择班级"
      data-class-select-placeholder-code="REQUIRED"
    >
      <input type="hidden" id="registerClassSelect" name="class"
        value="{{ request.form.get('class', '') }}" data-class-select-input>
      <button class="numoj-class-select-trigger" id="registerClassSelectTrigger"
        type="button" aria-haspopup="listbox" aria-expanded="false"
        aria-controls="registerClassOptions" aria-describedby="registerClassError"
        data-class-select-trigger>
        <span class="numoj-class-select-logo is-placeholder"
          data-class-select-current-logo aria-hidden="true"></span>
        <span class="numoj-class-select-current">
          <strong data-class-select-current-label>请选择班级</strong>
          <small data-class-select-current-code>REQUIRED</small>
        </span>
        <i class="fas fa-chevron-down numoj-class-select-chevron" aria-hidden="true"></i>
      </button>
      <div class="numoj-class-select-menu" id="registerClassOptions"
        role="listbox" aria-label="可注册的班级" data-class-select-menu hidden>
      {% for c in classes %}
        <button class="numoj-class-select-option" type="button" role="option"
          aria-selected="false" data-class-select-option
          data-class-select-value="{{ c.class_en }}"
          data-class-select-label="{{ c.class_cn }}"
          data-class-select-code="{{ c.class_en }}">
          {{ class_logo(c, 'numoj-class-select-logo') }}
          <span class="numoj-class-select-option-copy">
            <strong>{{ c.class_cn }}</strong>
            <small>{{ c.class_en }}</small>
          </span>
          <span class="numoj-class-select-option-state" aria-hidden="true">✓</span>
        </button>
      {% endfor %}
      </div>
      <p class="numoj-class-select-error" id="registerClassError"
        data-class-select-error role="alert" hidden></p>
    </div>
  </div>

  <button class="numoj-auth-primary" type="submit">注册</button>
</form>

<div class="numoj-auth-secondary is-centered">
  <span>已有账户？</span>
  <a href="{{ url_for('auth.login') }}">返回登录</a>
</div>
{% endblock %}

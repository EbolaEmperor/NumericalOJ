{% extends "layouts/site.html" %}
{% from 'components/layout/class_logo.html' import class_logo %}
{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card p-4" style="max-width: 100%; width: 100%; max-width: 400px;">
    <h2 class="mb-3 text-center">注册</h2>
    {% if error_message %}
      <div class="alert alert-danger">{{ error_message }}</div>
    {% endif %}
    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label for="email" class="form-label"><i class="fas fa-envelope"></i> 邮箱 </label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      
      <div class="mb-3">
        <label for="verification_code" class="form-label"><i class="fas fa-shield-alt"></i> 验证码 </label>
        <div class="input-group">
          <input type="text" class="form-control" id="verification_code" name="verification_code" required>
          <button type="button" class="btn btn-outline-secondary" id="send-code-btn" onclick="sendCode()">
            获取验证码
          </button>
        </div>
      </div>
      
      <div class="mb-3">
        <label for="username" class="form-label"><i class="fas fa-user"></i> 学号</label>
        <input type="text" class="form-control" id="username" name="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label"><i class="fas fa-key"></i> 密码</i></label>
        <input type="password" class="form-control" id="password" name="password" required>
      </div>
      <div class="mb-3">
        <label class="form-label" for="registerClassSelectTrigger"><i class="fas fa-users"></i> 班级 </label>
        <div
          class="numoj-class-select numoj-register-class-select"
          data-numoj-class-select
          data-class-select-auto
          data-class-select-required
          data-class-select-placeholder="请选择班级"
          data-class-select-placeholder-code="REQUIRED"
        >
          <input
            type="hidden"
            id="registerClassSelect"
            name="class"
            value="{{ request.form.get('class', '') }}"
            data-class-select-input
          >
          <button
            class="numoj-class-select-trigger"
            id="registerClassSelectTrigger"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="registerClassOptions"
            aria-describedby="registerClassError"
            data-class-select-trigger
          >
            <span
              class="numoj-class-select-logo is-placeholder"
              data-class-select-current-logo
              aria-hidden="true"
            ></span>
            <span class="numoj-class-select-current">
              <strong data-class-select-current-label>请选择班级</strong>
              <small data-class-select-current-code>REQUIRED</small>
            </span>
            <i class="fas fa-chevron-down numoj-class-select-chevron" aria-hidden="true"></i>
          </button>
          <div
            class="numoj-class-select-menu"
            id="registerClassOptions"
            role="listbox"
            aria-label="可注册的班级"
            data-class-select-menu
            hidden
          >
          {% for c in classes %}
            <button
              class="numoj-class-select-option"
              type="button"
              role="option"
              aria-selected="false"
              data-class-select-option
              data-class-select-value="{{ c.class_en }}"
              data-class-select-label="{{ c.class_cn }}"
              data-class-select-code="{{ c.class_en }}"
            >
              {{ class_logo(c, 'numoj-class-select-logo') }}
              <span class="numoj-class-select-option-copy">
                <strong>{{ c.class_cn }}</strong>
                <small>{{ c.class_en }}</small>
              </span>
              <span class="numoj-class-select-option-state" aria-hidden="true">✓</span>
            </button>
          {% endfor %}
          </div>
          <p class="numoj-class-select-error" id="registerClassError"
            data-class-select-error role="alert" hidden></p>
        </div>
      </div>
      
      <button type="submit" class="btn btn-outline-success w-100">
        <i class="fas fa-user-plus"></i> 注册
      </button>
    </form>
  </div>
</div>

<script>
function sendCode() {
    const email = document.getElementById('email').value;
    const btn = document.getElementById('send-code-btn');
    
    if (!email) {
        alert('请输入邮箱地址');
        return;
    }
    
    btn.disabled = true;
    fetch('/send_code', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
        body: `email=${encodeURIComponent(email)}`
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            let seconds = 60;
            const timer = setInterval(() => {
                btn.textContent = `${seconds}秒后重发`;
                if (--seconds < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '获取验证码';
                }
            }, 1000);
        } else {
            alert(data.message);
            btn.disabled = false;
        }
    })
    .catch(() => {
        btn.disabled = false;
    });
}
</script>
{% endblock %}

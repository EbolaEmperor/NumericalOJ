[supervisord]
logfile=%(here)s/../../logs/supervisor/observability.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/tmp/noj_observability_supervisord.pid
childlogdir=%(here)s/../../logs/services
umask=0077

[unix_http_server]
file=/tmp/noj_observability_supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/noj_observability_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:log_collector]
directory=%(here)s/../..
command=/bin/sh -c 'exec "%(here)s/../../.deploy/current-venv/bin/python3" -B scripts/log_admin.py serve'
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/log-collector.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="log-collector",NUMOJ_ENVIRONMENT="production",PYTHONDONTWRITEBYTECODE="1"

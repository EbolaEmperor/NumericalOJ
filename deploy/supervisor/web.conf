[supervisord]
logfile=%(here)s/../../logs/supervisor/web.log
logfile_maxbytes=10MB
logfile_backups=5
minfds=8192
pidfile=/tmp/noj_web_supervisord.pid
childlogdir=%(here)s/../../logs/services
umask=0077

[unix_http_server]
file=/tmp/noj_web_supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/noj_web_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:web]
directory=%(here)s/../..
umask=0022
command=/bin/sh -c 'exec "%(here)s/../../.deploy/current-venv/bin/python3" -m gunicorn --config deploy/gunicorn.py backend.oj:app'
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="web",NUMOJ_ENVIRONMENT="production"

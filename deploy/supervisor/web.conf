[supervisord]
logfile=/tmp/noj_web_supervisord.log
pidfile=/tmp/noj_web_supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/noj_web_supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/noj_web_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:web]
directory=%(here)s/../..
command=/bin/sh -c 'exec /home/ebola/.numericaloj-deploy/current-venv/bin/python3 -m gunicorn --config deploy/gunicorn.py oj:app'
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_web_stdout.log
stderr_logfile=/tmp/noj_web_stderr.log

[supervisord]
logfile=%(here)s/../../logs/supervisor/local-dev.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/tmp/noj_supervisord.pid
childlogdir=%(here)s/../../logs/services
nodaemon=false
umask=0077

[unix_http_server]
file=/tmp/noj_supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/noj_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:log_collector]
directory=%(here)s/../..
command=/bin/sh -c 'exec %(here)s/../../.venv/bin/python3 -B scripts/log_admin.py serve'
autostart=true
autorestart=true
startsecs=2
stopwaitsecs=15
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/log-collector.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="log-collector",NUMOJ_ENVIRONMENT="development",PYTHONDONTWRITEBYTECODE="1"
priority=10

[program:web]
directory=%(here)s/../..
umask=0022
command=/bin/sh -c '%(here)s/../../.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/../../.venv/bin/python3 oj.py'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/web.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="web",NUMOJ_ENVIRONMENT="development"
priority=20

[program:celery_judge]
directory=%(here)s/../..
umask=0022
command=/bin/sh -c '%(here)s/../../.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/../../.venv/bin/celery -A oj.celery worker --loglevel=info -Q celery -n judge@localhost'
environment=JUDGER_DOCKER_IMAGE="numericaloj-judger-lite:latest",JUDGER_NUMERIC_BACKEND="openblas",NUMOJ_SERVICE_NAME="worker-default",NUMOJ_ENVIRONMENT="development"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
priority=20

[program:celery_agent]
directory=%(here)s/../..
umask=0022
command=/bin/sh -c '%(here)s/../../.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/../../.venv/bin/celery -A oj.celery worker --loglevel=info -Q agent -c 1 --prefetch-multiplier=1 -n agent@localhost'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/worker-agent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=AGENT_JUDGE_DOCKER_IMAGE="numericaloj-agent-judge-lite:latest",NUMOJ_SERVICE_NAME="worker-agent",NUMOJ_ENVIRONMENT="development"
priority=20

[program:celery_agent_judge]
directory=%(here)s/../..
umask=0022
command=/bin/sh -c '%(here)s/../../.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/../../.venv/bin/celery -A oj.celery worker --loglevel=info -Q judge -c 2 -n agent_judge@localhost'
environment=AGENT_JUDGE_DOCKER_IMAGE="numericaloj-agent-judge-lite:latest",NUMOJ_SERVICE_NAME="worker-judge",NUMOJ_ENVIRONMENT="development"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/worker-judge.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
priority=20

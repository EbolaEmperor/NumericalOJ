[supervisord]
logfile=%(here)s/../../logs/supervisor/celery.log
logfile_maxbytes=10MB
logfile_backups=5
pidfile=/tmp/noj_celery_supervisord.pid
childlogdir=%(here)s/../../logs/services
umask=0077

[unix_http_server]
file=/tmp/noj_celery_supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/noj_celery_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:celery_judge]
directory=%(here)s/../..
umask=0022
; 普通判题每个 Docker 容器默认 --cpus=2。40 核机器上 Celery 默认会开 40 个
; worker，峰值等价 80 核容器配额，批量重判/提交时会把 Octave/gnuplot 拖到 TLE。
command=/bin/sh -c 'exec "%(here)s/../../.deploy/current-venv/bin/python3" -m celery -A backend.oj.celery worker --loglevel=info -Q celery -c 16 -n judge@%%h'
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/worker-default.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="worker-default",NUMOJ_ENVIRONMENT="production"

[program:celery_agent]
directory=%(here)s/../..
umask=0022
; 先以 1 个进程安全启动；worker ready 后从 site_settings 恢复 1..100 的动态上限。
command=/bin/sh -c 'exec "%(here)s/../../.deploy/current-venv/bin/python3" -m celery -A backend.oj.celery worker --loglevel=info -Q agent --autoscale=1,1 --prefetch-multiplier=1 -n agent@%%h'
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/services/worker-agent.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
strip_ansi=true
environment=NUMOJ_SERVICE_NAME="worker-agent",NUMOJ_ENVIRONMENT="production"

[group:celery]
programs=celery_judge,celery_agent

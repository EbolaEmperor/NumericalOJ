[supervisord]
logfile=/tmp/noj_celery_supervisord.log
pidfile=/tmp/noj_celery_supervisord.pid
childlogdir=/tmp

[unix_http_server]
file=/tmp/noj_celery_supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/noj_celery_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[program:celery_judge]
directory=%(here)s/../..
; 普通判题每个 Docker 容器默认 --cpus=2。40 核机器上 Celery 默认会开 40 个
; worker，峰值等价 80 核容器配额，批量重判/提交时会把 Octave/gnuplot 拖到 TLE。
command=/bin/sh -c 'exec /home/ebola/.numericaloj-deploy/current-venv/bin/python3 -m celery -A oj.celery worker --loglevel=info -Q celery -c 16 -n judge@%%h'
autostart=true
autorestart=true
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_judge_stdout.log
stderr_logfile=/tmp/noj_celery_judge_stderr.log

[program:celery_agent]
directory=%(here)s/../..
command=/bin/sh -c 'exec /home/ebola/.numericaloj-deploy/current-venv/bin/python3 -m celery -A oj.celery worker --loglevel=info -Q agent -c 1 -n agent@%%h'
autostart=true
autorestart=true
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_agent_stdout.log
stderr_logfile=/tmp/noj_celery_agent_stderr.log

[program:celery_agent_judge]
directory=%(here)s/../..
; -c 是「同时跑的判题容器」硬上限（worker 池大小）。真正的并发由每个比赛的模型端点
; 并发上限之和经 Redis 槽位限流控制（管理界面可调、无需重启）；这里设为较宽松的上限 16。
command=/bin/sh -c 'exec /home/ebola/.numericaloj-deploy/current-venv/bin/python3 -m celery -A oj.celery worker --loglevel=info -Q judge -c 16 -n agent_judge@%%h'
autostart=true
autorestart=true
stopwaitsecs=1900
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_agent_judge_stdout.log
stderr_logfile=/tmp/noj_celery_agent_judge_stderr.log

[group:celery]
programs=celery_judge,celery_agent,celery_agent_judge

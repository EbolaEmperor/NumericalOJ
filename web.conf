[supervisord]
logfile=/tmp/noj_web_supervisord.log
pidfile=/tmp/noj_web_supervisord.pid
childlogdir=/tmp

[program:web]
directory=%(here)s
command=/bin/sh -c 'python3 scripts/init_db_schema.py && python3 scripts/run_startup_jobs.py && exec python3 -m gunicorn --bind 0.0.0.0:2025 --worker-class gthread --workers 1 --threads 8 --timeout 600 --graceful-timeout 30 --keep-alive 5 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile - oj:app'
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_web_stdout.log
stderr_logfile=/tmp/noj_web_stderr.log

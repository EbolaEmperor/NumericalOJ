[supervisord]
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/tmp

[program:myflask]
directory=%(here)s
command=/bin/sh -c 'python3 scripts/init_db_schema.py && exec python3 oj.py'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_web_stdout.log
stderr_logfile=/tmp/noj_web_stderr.log

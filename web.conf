[supervisord]
logfile=/tmp/noj_web_supervisord.log
pidfile=/tmp/noj_web_supervisord.pid
childlogdir=/tmp

[program:web]
directory=%(here)s
command=/bin/sh -c 'python3 scripts/init_db_schema.py && exec python3 -m gunicorn --config gunicorn.conf.py oj:app'
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=45
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_web_stdout.log
stderr_logfile=/tmp/noj_web_stderr.log

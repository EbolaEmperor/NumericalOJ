name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-assets:
    name: Frontend assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Rebuild checked-in frontend assets
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run test:frontend
          npm --prefix frontend run build:frontend
      - name: Verify generated assets are current
        run: |
          tracked_compressed="$(
            git ls-files -- ':(glob)**/*.br' ':(glob)**/*.gz'
          )"
          if [ -n "$tracked_compressed" ]; then
            printf 'Git 禁止追踪预压缩旁路文件：\n%s\n' "$tracked_compressed"
            exit 1
          fi
          generated_status="$(
            git status --porcelain=v1 --untracked-files=all -- \
              frontend/public/static frontend/dist
          )"
          if [ -n "$generated_status" ]; then
            printf '%s\n' "$generated_status"
            exit 1
          fi

  compile:
    name: Python syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile all tracked Python entry points
        run: |
          python -m compileall -q backend deploy scripts skills tests
          python -m py_compile docker/agent_judge/report docker/agent_judge/run_harness

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install frontend test dependencies
        run: npm --prefix frontend ci
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r backend/requirements/production.txt \
            -r backend/requirements/test.txt
      - name: Run infrastructure-free unit tests
        run: |
          mkdir -p test-results logs/supervisor logs/services
          python -m pytest tests/unit \
            --junitxml=test-results/tests_unit.xml
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results
          path: test-results/*.xml
          if-no-files-found: error
          retention-days: 14

  integration:
    name: MySQL, Redis, CLI and Docker E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.4.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: myojdb_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      registry:
        image: registry:3
        ports:
          - 5000:5000
    env:
      NUMOJ_TEST_ENV: '1'
      OJ_LIVE_AI: '0'
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_DB: myojdb_test
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ci_root_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_DB: '15'
      JUDGER_DOCKER_IMAGE: numericaloj-judger-lite:latest
      AGENT_JUDGE_DOCKER_IMAGE: numericaloj-agent-judge-lite:latest
      NUMOJ_PI_AGENT_JUDGE_IMAGE: numericaloj-agent-judge-lite:latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      - name: Install host test toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            default-mysql-client \
            fonts-noto-cjk \
            latexmk \
            redis-tools \
            texlive-fonts-recommended \
            texlive-lang-chinese \
            texlive-latex-recommended \
            texlive-xetex
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r backend/requirements/production.txt \
            -r backend/requirements/test.txt
      - name: Verify isolated CI environment
        run: |
          python -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          mysql --version
          redis-cli --version
          node --version
          docker version
          xelatex --version | head -n 1
      - name: Run database integration tests
        run: bash tests/ci/run-ci.sh tests/db
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # docker-container 无法直接读取 Docker Engine 的本地镜像；host 网络
          # 允许两个 Buildx 构建通过本 job 的临时 registry 传递 Lean 基础镜像。
          driver-opts: network=host
      - name: Build the real judge image
        timeout-minutes: 20
        uses: docker/build-push-action@v7
        with:
          context: docker/judger-lite
          load: true
          tags: numericaloj-judger-lite:latest
          cache-from: type=gha,scope=judger-lite
          cache-to: type=gha,mode=max,scope=judger-lite
      - name: Build the pinned Lean4 and Mathlib runtime
        timeout-minutes: 30
        uses: docker/build-push-action@v7
        with:
          context: docker/lean4
          tags: localhost:5000/numericaloj-lean4:ci
          push: true
          cache-from: type=gha,scope=lean4
          cache-to: type=gha,mode=max,scope=lean4
      - name: Build the Agent Judge lite image
        timeout-minutes: 30
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/agent_judge-lite/Dockerfile
          build-contexts: |
            numericaloj-lean4-runtime=docker-image://localhost:5000/numericaloj-lean4:ci
          build-args: |
            LEAN4_IMAGE=numericaloj-lean4-runtime
          load: true
          tags: numericaloj-agent-judge-lite:latest
          cache-from: type=gha,scope=agent-judge-lite
          cache-to: type=gha,mode=max,scope=agent-judge-lite
      - name: Run CLI and Docker end-to-end tests
        run: bash tests/ci/run-ci.sh tests/e2e
      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: test-results/*.xml
          if-no-files-found: warn
          retention-days: 14

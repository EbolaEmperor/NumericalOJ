name: CI

# 轻量 CI 门禁：每次 push / PR 都跑。
# - compile：对全部 Python 文件做 py_compile（零依赖、必过的语法门禁）。
# - unit：安装依赖后跑全部「无需 MySQL/Redis/编译器」的纯逻辑单测。
# 需要真实 gcc/g++/octave/MySQL/Redis 的完整 CLI e2e 测试见 tests/ci/
# （Docker Compose，只能在本地或非生产服务器运行，禁止在 why-server/computing 上跑）。

on:
  push:
  pull_request:

jobs:
  frontend-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Rebuild checked-in Monaco assets
        run: |
          npm ci
          npm run build:monaco
      - name: Verify generated assets are current
        run: git diff --exit-code -- static/vendor/monaco

  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: py_compile all sources
        run: |
          python -m compileall -q oj.py oj_modules deploy tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/production.txt -r requirements/test.txt
      - name: Run infra-free unit tests
        run: python -m pytest -q tests/unit

    <script>
      (() => {
        let settleMathJaxReady;
        window.NumOJMathJaxReady = new Promise((resolve) => {
          settleMathJaxReady = resolve;
        });
        window.MathJax = {
          startup: {
            typeset: false,
            ready: () => {
              try {
                window.MathJax.startup.defaultReady();
                window.MathJax.startup.promise.then(
                  () => settleMathJaxReady(true),
                  () => settleMathJaxReady(false),
                );
              } catch (error) {
                settleMathJaxReady(false);
                throw error;
              }
            },
          },
          loader: {load: []},
          tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            packages: ['base', 'ams', 'newcommand', 'noundefined']
          },
          options: {enableMenu: false}
        };
      })();
    </script>
    <script src="/static/vendor/mathjax/tex-mml-chtml.js"></script>
    <script
      src="/static/app/rich-content-assets.js"
      data-mermaid-src="/static/vendor/mermaid/mermaid.min.js"
      data-highlighter-src="/static/vendor/shiki-markdown/highlighter.js"
      data-semantic-tokens-src="/static/app/editor-semantic-tokens.js"></script>

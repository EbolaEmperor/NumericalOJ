services:
  mysql:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: myojdb
    volumes:
      - ../../myojdb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pci_root_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    build:
      context: ../..
      dockerfile: tests/ci/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 不再覆盖 JUDGER_RUN_ROOT：判题运行目录用内置默认 <OJ_ROOT>/judger（容器内 /app/judger），
      # 不在 tmp 下；submission_output_image 端点通过 judger_core.run_dir_for 解析同一目录。
      # judger_core 在 import 时读取 MKLROOT；指向下面挂入的宿主 oneAPI MKL
      MKLROOT: /opt/intel/oneapi/mkl/latest
    volumes:
      - ../../test-results:/app/test-results
      # 复用宿主已装的 Intel oneAPI MKL（与生产判题同一份），只读挂入容器
      - /opt/intel/oneapi/mkl:/opt/intel/oneapi/mkl:ro
      # 线上生产 config.py 只读挂入（绝不写库）：run-ci.sh 会把其中的真实 AI key
      # 合并进 /app/config.py，让 CI 用线上 API 跑真实 AI 链路。缺这个文件时
      # run-ci.sh 自动回退到占位符配置（AI live 测试 skip），不影响其余测试。
      - /home/ebola/oj/config.py:/run/prod_config.py:ro
    command: ["bash", "tests/ci/run-ci.sh"]

services:
  mysql:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ci_root_password
      MYSQL_DATABASE: myojdb_test
    volumes:
      - ../../backend/database/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pci_root_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    build:
      context: ../..
      dockerfile: tests/ci/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NUMOJ_TEST_ENV: "1"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: myojdb_test
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ci_root_password
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "15"
      # 不再覆盖 JUDGER_RUN_ROOT：判题运行目录用内置默认 <OJ_ROOT>/judger（容器内 /app/judger），
      # 不在 tmp 下；submission_output_image 端点通过 judger_core.run_dir_for 解析同一目录。
      # judger_core 在 import 时读取 MKLROOT；指向下面挂入的宿主 oneAPI MKL
      MKLROOT: /opt/intel/oneapi/mkl/latest
    volumes:
      - ../../test-results:/app/test-results
      # 复用宿主已装的 Intel oneAPI MKL（与生产判题同一份），只读挂入容器
      - /opt/intel/oneapi/mkl:/opt/intel/oneapi/mkl:ro
    command: ["bash", "tests/ci/run-ci.sh"]

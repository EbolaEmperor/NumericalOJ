[supervisord]
logfile=/tmp/noj_supervisord.log
pidfile=/tmp/noj_supervisord.pid
childlogdir=/tmp
nodaemon=false

[unix_http_server]
file=/tmp/noj_supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/noj_supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:web]
directory=%(here)s
command=/bin/sh -c '%(here)s/.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/.venv/bin/python3 oj.py'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_web.log

[program:celery_judge]
directory=%(here)s
command=/bin/sh -c '%(here)s/.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/.venv/bin/celery -A oj.celery worker --loglevel=info -Q celery -n judge@localhost'
environment=JUDGER_DOCKER_IMAGE="numericaloj-judger-lite:latest",JUDGER_NUMERIC_BACKEND="openblas"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_judge.log

[program:celery_agent]
directory=%(here)s
command=/bin/sh -c '%(here)s/.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/.venv/bin/celery -A oj.celery worker --loglevel=info -Q agent -c 1 -n agent@localhost'
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_agent.log

[program:celery_agent_judge]
directory=%(here)s
command=/bin/sh -c '%(here)s/.venv/bin/python3 scripts/init_db_schema.py && exec %(here)s/.venv/bin/celery -A oj.celery worker --loglevel=info -Q judge -c 2 -n agent_judge@localhost'
environment=AGENT_JUDGE_DOCKER_IMAGE="numericaloj-agent-judge-lite:latest"
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/noj_celery_agent_judge.log

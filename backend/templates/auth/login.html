{% extends "auth/base.html" %}

{% block title %}登录 - Numerical OJ{% endblock %}

{% block auth_content %}
<form class="numoj-auth-form" method="POST" action="{{ url_for('auth.login') }}">
  {% if next_url %}
    <input type="hidden" name="next" value="{{ next_url }}">
  {% endif %}

  <div class="numoj-auth-field">
    <label for="username">学号</label>
    <span class="numoj-auth-control">
      <input id="username" name="username" type="text" autocomplete="username"
        value="{{ request.form.get('username', '') }}" placeholder="请输入学号" required autofocus>
    </span>
  </div>

  <div class="numoj-auth-field">
    <label for="password">密码</label>
    <span class="numoj-auth-control">
      <input id="password" name="password" type="password" autocomplete="current-password"
        placeholder="请输入密码" required>
      <button class="numoj-auth-password-toggle" type="button"
        data-auth-password-toggle="password" aria-label="显示密码" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/>
          <circle cx="12" cy="12" r="2.6"/>
          <path class="numoj-auth-eye-slash" d="M4 4l16 16"/>
        </svg>
      </button>
    </span>
  </div>

  <button class="numoj-auth-primary" type="submit">登录</button>
</form>

<div class="numoj-auth-secondary">
  <a href="{{ url_for('auth.register') }}">注册新账户</a>
  <a href="{{ url_for('auth.forgot_password') }}">忘记密码？</a>
</div>
{% endblock %}

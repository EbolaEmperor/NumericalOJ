<!-- 密码修改模态框 -->
{% if user %}
<div class="numoj-account-toast" id="accountModalToast" role="status" aria-live="polite" hidden></div>

<div class="modal fade numoj-account-modal numoj-password-modal" id="changePasswordModal" tabindex="-1"
  aria-labelledby="changePasswordModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <span class="numoj-account-modal-accent" aria-hidden="true"></span>

      <div class="modal-header">
        <div class="numoj-account-modal-title">
          <span class="numoj-account-kicker">SECURITY · PASSWORD</span>
          <h2 class="modal-title" id="changePasswordModalLabel">修改密码</h2>
        </div>
        <button type="button" class="numoj-account-close" data-bs-dismiss="modal" aria-label="关闭修改密码弹窗">
          <span aria-hidden="true">×</span>
        </button>
      </div>

      <form id="passwordForm" method="POST" action="{{ url_for('auth.change_password') }}" novalidate
        data-password-code-url="{{ url_for('auth.send_password_code') }}"
        data-user-email="{{ user.email }}">
        <div class="modal-body numoj-account-modal-body">
          <section class="numoj-account-section" aria-labelledby="passwordIdentityTitle">
            <div class="numoj-account-section-heading">
              <h3 id="passwordIdentityTitle">验证身份</h3>
              <span>STEP 01 / 02</span>
            </div>
            <div class="numoj-account-identity">
              <span class="numoj-account-identity-icon" aria-hidden="true">@</span>
              <span class="numoj-account-identity-copy">
                <strong>{{ user.email }}</strong>
                <small>{% if mail_service_configured %}验证码仅发送至当前账户邮箱{% else %}站点尚未配置邮件服务，请联系管理员{% endif %}</small>
              </span>
              <span class="numoj-account-state">{{ '可用' if mail_service_configured else '不可用' }}</span>
            </div>
          </section>

          <div class="numoj-account-form-stack">
            <div class="numoj-account-field">
              <div class="numoj-account-input numoj-account-input-action">
                <input id="passwordCodeInput" name="code" type="text" inputmode="numeric" maxlength="6"
                  autocomplete="one-time-code" placeholder="••••••" aria-label="验证码"
                  aria-describedby="passwordCodeMessage" required>
                <button type="button" id="sendPasswordCodeBtn" {% if not mail_service_configured %}disabled aria-disabled="true" title="站点尚未配置邮件服务，请联系管理员"{% endif %}>发送验证码</button>
              </div>
              <p class="numoj-account-field-message" id="passwordCodeMessage" aria-live="polite">
                发送后 5 分钟内有效。
              </p>
            </div>
          </div>

          <div class="numoj-account-form-stack">
            <div class="numoj-account-field">
              <div class="numoj-account-field-heading">
                <label for="newPasswordInput">新密码</label>
                <span id="passwordStrengthLabel">尚未输入</span>
              </div>
              <div class="numoj-account-input">
                <input id="newPasswordInput" name="new_password" type="password" minlength="6"
                  autocomplete="new-password" placeholder="至少输入 6 个字符" required>
              </div>
              <div class="numoj-password-meter" id="passwordStrengthMeter" data-level="0"
                role="progressbar" aria-label="密码强度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
                <span></span><span></span><span></span>
              </div>
              <div class="numoj-password-rules" id="passwordRules">
                <span id="passwordRuleLength">至少 6 个字符</span>
                <span id="passwordRuleMix">建议同时包含字母与数字</span>
              </div>
            </div>

            <div class="numoj-account-field">
              <div class="numoj-account-field-heading">
                <label for="confirmPasswordInput">确认新密码</label>
                <span>再次输入</span>
              </div>
              <div class="numoj-account-input">
                <input id="confirmPasswordInput" name="confirm_password" type="password"
                  autocomplete="new-password" placeholder="重复新密码"
                  aria-describedby="passwordMatchMessage" required>
              </div>
              <p class="numoj-account-field-message" id="passwordMatchMessage" aria-live="polite" hidden></p>
            </div>
          </div>

          <p class="numoj-account-form-status" id="passwordFormStatus" role="status" aria-live="polite" hidden></p>
        </div>

        <div class="modal-footer">
          <span class="numoj-account-footer-note">FORM · VALIDATION INLINE</span>
          <div class="numoj-account-footer-actions">
            <button type="button" class="numoj-account-button" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="numoj-account-button numoj-account-button-dark"
              id="passwordSubmitBtn" disabled>确认修改</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endif %}

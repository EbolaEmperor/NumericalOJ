[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q --timeout=180
markers =
    judger: 真实编译/运行 gcc/g++/python3/octave 的判题测试
    slow: 较慢测试
    e2e: 启动本地 Web 服务并通过 numoj-user/numoj-admin CLI 做端到端验证
    live_ai: 打真实外部模型接口的本地测试；需显式设置 OJ_LIVE_AI=1 和对应密钥，GitHub CI 默认 skip
